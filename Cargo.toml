# Unified Rust workspace for all NebulaStream Rust crates.
# Add new crates here when introducing Rust code in any part of the project.
# CMake auto-discovers members via `cargo metadata` (see cmake/EnableRust.cmake).
[workspace]
resolver = "3"
members = [
    "nes-network/network",
    "nes-network/network-bindings",
    "nes-common/rust/spdlog-bindings",
    "nes-physical-operators/rust/cast-to-unix-timestamp",
    "nes-coordinator/model",
    "nes-coordinator/migration",
    "nes-coordinator/controller",
    "nes-coordinator/coordinator",
    "nes-coordinator/request-handler",
    "nes-coordinator/simulation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
module_name_repetitions = "allow"
# The lint suggests Duration::from_mins and from_hours,
# which are not stable in the dev container's pinned rustc.
duration_suboptimal_units = "allow"

# Shared dependency declarations. Member crates opt in with `dep.workspace = true`.
[workspace.dependencies]
nes_network = { path = "nes-network/network" }
migration = { path = "nes-coordinator/migration" }
model = { path = "nes-coordinator/model" }
controller = { path = "nes-coordinator/controller" }
request_handler = { path = "nes-coordinator/request-handler" }
coordinator = { path = "nes-coordinator/coordinator" }

ahash = "0.8"
anyhow = "1.0"
async-channel = "2.3.1"
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
cxx = "1.0.194"
futures = "0.3.31"
# The tonic version behind the madsim facade depends on indexmap 1 through tower.
# Without the std feature, indexmap 1 detects std with a probe that fails under `-Zbuild-std`,
# which the sanitizer builds use, and tower then does not compile.
indexmap = { version = "1.9", features = ["std"] }
libtest-mimic = "0.8"
madsim = { version = "0.2.34", features = ["macros"] }
pin-project = "1.1.10"
proptest = "1.5"
proptest-derive = "0.5"
prost = "0.13"
# sea-orm 1.1.10 and later need sqlx 0.8.4 or later, and the sqlx fork below is based on 0.8.2.
# sea-orm-macros must also stay at 1.1.9 in Cargo.lock,
# because a plain `cargo update` moves it and sea-orm-migration 1.1.9 then fails to compile.
sea-orm = { version = "=1.1.9", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "debug-print",
    "with-json",
    "sqlite-use-returning-for-3_35",
] }
# Kept version-locked with sea-orm above, because they share types.
sea-orm-migration = { version = "=1.1.9", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "=0.8.2", default-features = false, features = ["sqlite"] }
strum = { version = "0.26", features = ["derive"] }
test-strategy = "0.4.5"
thiserror = "2.0"
tokio = { version = "1.52.0", features = ["macros", "rt", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# The real tokio under a second name, for members that use the madsim facade as `tokio`.
tokio-real = { version = "1.52.0", package = "tokio", features = ["rt"] }
tokio-retry2 = { version = "0.5", features = ["jitter", "tracing"] }
tokio-serde = { version = "0.9", features = ["cbor", "serde_cbor"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.13", features = ["codec"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3"
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4"] }

# The coordinator crates declare tokio and tonic inline as madsim facade packages
# (same API, simulator backend under `--cfg madsim`, plain re-export otherwise).
# They cannot inherit tokio from this table: workspace inheritance cannot rename a package,
# and the tokio entry must stay the real crate for the network and binding members.
# The dependency policy script allows the madsim-* facades as the only inline exception.

# The forks make sqlx, getrandom and tokio-retry2 deterministic under `--cfg madsim`.
# Without that cfg, they behave like upstream.
# The pinned sqlx and tokio-retry2 revisions are on each fork's branch for the pinned version.
[patch.crates-io]
sqlx = { git = "https://github.com/nebulastream/sqlx.git", rev = "5ee80bd0678dbe6741040536c6445f449079d7b4" }
getrandom = { git = "https://github.com/madsim-rs/getrandom.git", rev = "e79a7aecbcf8a43a802d30742667b77d75c613bd" }
tokio-retry2 = { git = "https://github.com/nebulastream/tokio-retry.git", rev = "d916e677f7d5a885eee17edd0bf793559798620a" }
