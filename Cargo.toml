# Unified Rust workspace for all NebulaStream Rust crates.
# Add new crates here when introducing Rust code in any part of the project.
# CMake auto-discovers members via `cargo metadata` (see cmake/EnableRust.cmake).
[workspace]
resolver = "2"
members = [
    "nes-io-runtime/rust/nes-io-runtime",
    "nes-io-runtime/rust/nes-io-runtime-bindings",
    "nes-memory/rust/nes-buffer-bindings",
    "nes-memory/rust/my-buffer-test",
    "nes-memory/rust/nes-buffer-runtime",
    "nes-network/network",
    "nes-network/network-bindings",
    "nes-common/rust/spdlog-bindings",
    "nes-common/rust/nes-config-options",
    "nes-plugins/Functions/RustAnswer/rust",
    "nes-sinks/rust/nes-sink-validation",
    "nes-sinks/rust/nes-sink-validation-bindings",
    "nes-sinks/rust/nes-sink-runtime",
    "nes-sinks/rust/nes-sink-runtime-bindings",
    "nes-sources/rust/nes-source-validation",
    "nes-sources/rust/nes-source-validation-bindings",
    "nes-sources/rust/nes-source-runtime",
    "nes-sources/rust/nes-source-runtime-bindings",
]

# Shared dependency declarations. Member crates opt in with `dep.workspace = true`.
[workspace.dependencies]
nes_io_runtime = { path = "nes-io-runtime/rust/nes-io-runtime" }
nes_io_runtime_bindings = { path = "nes-io-runtime/rust/nes-io-runtime-bindings" }
nes_buffer_bindings = { path = "nes-memory/rust/nes-buffer-bindings" }
nes_buffer_runtime = { path = "nes-memory/rust/nes-buffer-runtime" }
nes_network = { path = "nes-network/network" }
nes_config_options = { path = "nes-common/rust/nes-config-options" }
nes_sink_validation = { path = "nes-sinks/rust/nes-sink-validation" }
nes_sink_validation_bindings = { path = "nes-sinks/rust/nes-sink-validation-bindings" }
nes_sink_runtime = { path = "nes-sinks/rust/nes-sink-runtime" }
nes_sink_runtime_bindings = { path = "nes-sinks/rust/nes-sink-runtime-bindings" }
nes_source_validation = { path = "nes-sources/rust/nes-source-validation" }
nes_source_validation_bindings = { path = "nes-sources/rust/nes-source-validation-bindings" }
nes_source_runtime = { path = "nes-sources/rust/nes-source-runtime" }
nes_source_runtime_bindings = { path = "nes-sources/rust/nes-source-runtime-bindings" }
cxx = "1.0.194"
tokio = "1.52.0"
async-trait = "0.1.89"
linkme = "0.3.35"
tracing = "0.1.44"
scopeguard = "1.2.0"
serde_json = "1.0.149"
