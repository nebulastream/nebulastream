# Unified Rust workspace for all NebulaStream Rust crates.
# Add new crates here when introducing Rust code in any part of the project.
# CMake auto-discovers members via `cargo metadata` (see cmake/EnableRust.cmake).
[workspace]
resolver = "3"
members = [
    "nes-network/network",
    "nes-network/network-bindings",
    "nes-common/rust/spdlog-bindings",
    "nes-physical-operators/rust/cast-to-unix-timestamp",
    "nes-coordinator/model",
    "nes-coordinator/migration",
    "nes-coordinator/controller",
    "nes-coordinator/coordinator",
    "nes-coordinator/request-handler",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
module_name_repetitions = "allow"
# The lint suggests Duration::from_mins/from_hours, which are not stable in
# the pinned dev-container rustc, so the constants stay in from_secs.
duration_suboptimal_units = "allow"

# Shared dependency declarations. Member crates opt in with `dep.workspace = true`.
[workspace.dependencies]
nes_network = { path = "nes-network/network" }
migration = { path = "nes-coordinator/migration" }
model = { path = "nes-coordinator/model" }
controller = { path = "nes-coordinator/controller" }
request_handler = { path = "nes-coordinator/request-handler" }

anyhow = "1.0"
async-channel = "2.3.1"
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
cxx = "1.0.194"
futures = "0.3.31"
pin-project = "1.1.10"
proptest = "1.5"
proptest-derive = "0.5"
prost = "0.13"
sea-orm = { version = "=1.1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "debug-print",
    "with-json",
    "sqlite-use-returning-for-3_35",
] }
# Kept version-locked with sea-orm above (they share types); pin both here.
sea-orm-migration = { version = "=1.1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "=0.8.2", default-features = false, features = ["sqlite"] }
strum = { version = "0.26", features = ["derive"] }
test-strategy = "0.4.5"
thiserror = "2.0"
tokio = { version = "1.52.0", features = ["macros", "rt", "rt-multi-thread", "sync", "net", "io-util", "time"] }
tokio-retry2 = { version = "0.5", features = ["jitter", "tracing"] }
tokio-serde = { version = "0.9", features = ["cbor", "serde_cbor"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.13", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = "0.3"
url = { version = "2.5.4", features = ["serde"] }

# The coordinator crates declare tokio and tonic inline as madsim facade packages
# (same API, simulator backend under `--cfg madsim`, plain re-export otherwise).
# They cannot inherit those from this table: workspace inheritance cannot rename a package,
# and the entries here must stay the real crates for the network and binding members.
# The dependency policy script allows the madsim-* facades as the only inline exception.
