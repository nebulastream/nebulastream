# Unified Rust workspace for all NebulaStream Rust crates.
# Add new crates here when introducing Rust code in any part of the project.
# CMake auto-discovers members via `cargo metadata` (see cmake/EnableRust.cmake).
[workspace]
resolver = "3"
members = [
    "nes-network/network",
    "nes-network/network-bindings",
    "nes-common/rust/spdlog-bindings",
    "nes-coordinator/model",
    "nes-coordinator/migration",
    "nes-coordinator/controller",
    "nes-coordinator/coordinator",
    "nes-coordinator/bridge",
    "nes-frontend/nebucli",
]
# The bridge and nebucli crates link against the C++ tree, so a bare
# `cargo build` at the workspace root would need the CMake build to exist.
# Keep them out of the default set; CMake drives them explicitly.
default-members = [
    "nes-network/network",
    "nes-network/network-bindings",
    "nes-common/rust/spdlog-bindings",
    "nes-coordinator/model",
    "nes-coordinator/migration",
    "nes-coordinator/controller",
    "nes-coordinator/coordinator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Shared dependency declarations. Member crates opt in with `dep.workspace = true`.
[workspace.dependencies]
nes_network = { path = "nes-network/network" }
migration = { path = "nes-coordinator/migration" }
model = { path = "nes-coordinator/model" }
controller = { path = "nes-coordinator/controller" }
coordinator = { path = "nes-coordinator/coordinator" }
coordinator_bridge = { path = "nes-coordinator/bridge" }

anyhow = "1.0"
async-channel = "2.3.1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
cxx = "1.0.194"
futures = "0.3.31"
inventory = "0.3"
libtest-mimic = "0.8"
madsim = { version = "0.2.34", features = ["macros"] }
pin-project = "1.1.10"
proptest = "1.5"
proptest-derive = "0.5"
prost = "=0.13.4"
sea-orm = { version = "=1.1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "debug-print",
    "with-json",
    "sqlite-use-returning-for-3_35",
] }
# Kept version-locked with sea-orm above (they share types); pin both here.
sea-orm-migration = { version = "=1.1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlx = { version = "=0.8.2", default-features = false, features = ["sqlite"] }
strum = { version = "0.26", features = ["derive"] }
test-strategy = "0.4.5"
thiserror = "2.0"
tokio = { version = "1.52.0", features = ["macros", "rt", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Pinned to the API surface of the madsim fork (madsim-rs/rust-tokio-retry)
# that the simulation build patches in; newer releases renamed spawn to start.
tokio-retry = "=0.3.0"
tokio-retry2 = { version = "0.5", features = ["jitter", "tracing"] }
tokio-serde = { version = "0.9", features = ["cbor", "serde_cbor", "json", "serde_json"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.13", features = ["codec"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
url = { version = "2.5.4", features = ["serde"] }

# The coordinator crates declare tokio and tonic inline as madsim facade
# packages (same API, simulator backend under `--cfg madsim`, plain re-export
# otherwise). They cannot inherit those from this table because workspace
# inheritance cannot rename a package, and the entries here must stay the real
# crates for the network and binding members. The dependency policy script
# allows the madsim-* facades as the only inline exception.
[patch.crates-io]
sqlx = { git = "https://github.com/madsim-rs/sqlx.git", rev = "3efe6d0065963db2a2b7f30dee69f647e28dec81" }
tokio-retry = { git = "https://github.com/madsim-rs/rust-tokio-retry.git", rev = "95e2fd3" }
getrandom = { git = "https://github.com/madsim-rs/getrandom.git", rev = "e79a7ae" }
