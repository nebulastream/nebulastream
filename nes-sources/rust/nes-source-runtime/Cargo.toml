[package]
name = "nes_source_runtime"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]
path = "src/source_runtime.rs"

[dependencies]
nes_buffer_bindings.workspace = true
nes_buffer_runtime.workspace = true
tracing.workspace = true
linkme.workspace = true
nes_source_validation.workspace = true
nes_io_runtime.workspace = true
tokio = { features = ["fs", "io-util", "macros", "tracing"], workspace = true }
async-trait = { workspace = true }
scopeguard.workspace = true
