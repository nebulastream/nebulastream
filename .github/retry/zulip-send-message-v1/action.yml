name: Send a Zulip message
description: Run zulip/github-actions-zulip/send-message@v1 and retry it on failure. Generated by workflow-gen.py.
inputs:
  api-key:
    description: API key used to interact with the Zulip API. You can get an API key through Zulip's web interface.
    required: true
  email:
    description: Email address of the user who owns the API key mentioned above.
    required: true
  organization-url:
    description: Zulip organization canonical URL.
    required: true
  to:
    description: For stream messages, either the name or integer ID of the stream. For private messages, either a list containing integer user IDs or a list containing string email addresses (separated by comma).
    required: true
  type:
    description: 'The type of message to be sent. private for a private message and stream for a stream message. Must be one of: private, stream.'
    required: true
  topic:
    description: The topic of the message. Only required for stream messages (type="stream"), ignored otherwise. Maximum length of 60 characters.
    required: false
  content:
    description: The content of the message. Maximum message size of 10000 bytes.
    required: true
runs:
  using: composite
  steps:
  - name: Send a Zulip message (attempt 1/3)
    id: attempt-1
    continue-on-error: true
    uses: zulip/github-actions-zulip/send-message@e4c8f27c732ba9bd98ac6be0583096dea82feea5 # v1
    with:
      api-key: ${{ inputs.api-key }}
      email: ${{ inputs.email }}
      organization-url: ${{ inputs.organization-url }}
      to: ${{ inputs.to }}
      type: ${{ inputs.type }}
      topic: ${{ inputs.topic }}
      content: ${{ inputs.content }}
  - name: Wait 10s before attempt 2
    if: steps.attempt-1.outcome == 'failure'
    shell: bash
    run: sleep 10
  - name: Send a Zulip message (attempt 2/3)
    id: attempt-2
    if: steps.attempt-1.outcome == 'failure'
    continue-on-error: true
    uses: zulip/github-actions-zulip/send-message@e4c8f27c732ba9bd98ac6be0583096dea82feea5 # v1
    with:
      api-key: ${{ inputs.api-key }}
      email: ${{ inputs.email }}
      organization-url: ${{ inputs.organization-url }}
      to: ${{ inputs.to }}
      type: ${{ inputs.type }}
      topic: ${{ inputs.topic }}
      content: ${{ inputs.content }}
  - name: Wait 20s before attempt 3
    if: steps.attempt-2.outcome == 'failure'
    shell: bash
    run: sleep 20
  - name: Send a Zulip message (attempt 3/3)
    id: attempt-3
    if: steps.attempt-2.outcome == 'failure'
    uses: zulip/github-actions-zulip/send-message@e4c8f27c732ba9bd98ac6be0583096dea82feea5 # v1
    with:
      api-key: ${{ inputs.api-key }}
      email: ${{ inputs.email }}
      organization-url: ${{ inputs.organization-url }}
      to: ${{ inputs.to }}
      type: ${{ inputs.type }}
      topic: ${{ inputs.topic }}
      content: ${{ inputs.content }}
