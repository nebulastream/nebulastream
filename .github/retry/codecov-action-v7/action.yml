      env_vars: ${{ inputs.env_vars }}
      exclude: ${{ inputs.exclude }}
      fail_ci_if_error: true
      files: ${{ inputs.files }}
      flags: ${{ inputs.flags }}
      force: ${{ inputs.force }}
      git_service: ${{ inputs.git_service }}
      gcov_args: ${{ inputs.gcov_args }}
      gcov_executable: ${{ inputs.gcov_executable }}
      gcov_ignore: ${{ inputs.gcov_ignore }}
