      report_code: ${{ inputs.report_code }}
      report_type: ${{ inputs.report_type }}
      root_dir: ${{ inputs.root_dir }}
      run_command: ${{ inputs.run_command }}
      skip_validation: ${{ inputs.skip_validation }}
      slug: ${{ inputs.slug }}
      swift_project: ${{ inputs.swift_project }}
      token: ${{ inputs.token }}
      url: ${{ inputs.url }}
