name: Send the Zulip PR reminder
description: Run LeoRaasch/my-github-actions/zulip-pr-reminder@v1 and retry it on failure. Generated by workflow-gen.py.
inputs:
  git-name:
    description: The full path to the github repository, e.g. <username/repositoryname>
    required: true
  git-token:
    description: The Github token of the repository, whose prs should be monitored. Transmit as Github secret
    required: true
  mapping:
    description: 'Githubname: Zulipname mappings in JSON format. E.g. {"gitname 1": "@**zulipname 1**", "gitname 2": "@**zulipname 2**"}'
    required: true
  bot-api-key:
    description: API key of the bot, that should send the message. Transmit as Github secret
    required: true
  bot-email:
    description: Email adress of the bot, that should send the message
    required: true
  organization-url:
    description: URL of the Zulip organization
    required: true
  channel:
    description: Channel that should receive the reminders
    required: false
    default: pr-reminders
  topic:
    description: Topic of the channel that should receive the reminders
    required: false
    default: channel events
runs:
  using: composite
  steps:
  - name: Send the Zulip PR reminder (attempt 1/3)
    id: attempt-1
    continue-on-error: true
    uses: LeoRaasch/my-github-actions/zulip-pr-reminder@b9f3bd0f72012c7ebcb6be7c191144282c4a676f # v1
    with:
      git-name: ${{ inputs.git-name }}
      git-token: ${{ inputs.git-token }}
      mapping: ${{ inputs.mapping }}
      bot-api-key: ${{ inputs.bot-api-key }}
      bot-email: ${{ inputs.bot-email }}
      organization-url: ${{ inputs.organization-url }}
      channel: ${{ inputs.channel }}
      topic: ${{ inputs.topic }}
  - name: Wait 10s before attempt 2
    if: steps.attempt-1.outcome == 'failure'
    shell: bash
    run: sleep 10
  - name: Send the Zulip PR reminder (attempt 2/3)
    id: attempt-2
    if: steps.attempt-1.outcome == 'failure'
    continue-on-error: true
    uses: LeoRaasch/my-github-actions/zulip-pr-reminder@b9f3bd0f72012c7ebcb6be7c191144282c4a676f # v1
    with:
      git-name: ${{ inputs.git-name }}
      git-token: ${{ inputs.git-token }}
      mapping: ${{ inputs.mapping }}
      bot-api-key: ${{ inputs.bot-api-key }}
      bot-email: ${{ inputs.bot-email }}
      organization-url: ${{ inputs.organization-url }}
      channel: ${{ inputs.channel }}
      topic: ${{ inputs.topic }}
  - name: Wait 20s before attempt 3
    if: steps.attempt-2.outcome == 'failure'
    shell: bash
    run: sleep 20
  - name: Send the Zulip PR reminder (attempt 3/3)
    id: attempt-3
    if: steps.attempt-2.outcome == 'failure'
    uses: LeoRaasch/my-github-actions/zulip-pr-reminder@b9f3bd0f72012c7ebcb6be7c191144282c4a676f # v1
    with:
      git-name: ${{ inputs.git-name }}
      git-token: ${{ inputs.git-token }}
      mapping: ${{ inputs.mapping }}
      bot-api-key: ${{ inputs.bot-api-key }}
      bot-email: ${{ inputs.bot-email }}
      organization-url: ${{ inputs.organization-url }}
      channel: ${{ inputs.channel }}
      topic: ${{ inputs.topic }}
