name: Debug Classify
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          base_sha: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          files_from_source_file: .github/ci/full-ci-skip-paths.txt
      - run: |
          echo "any_changed: ${{ steps.changed-files.outputs.any_changed }}"
          echo "only_changed: ${{ steps.changed-files.outputs.only_changed }}"
