name: Nightly Quick Start Check

on:
  workflow_call:
    inputs:
      head_sha:
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  quick-start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Run Quick Start commands
        run: bash docs/website/scripts/test-quick-start.sh
