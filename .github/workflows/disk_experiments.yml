name: Disk Experiments (combined)
description: |
  Temporary, only exists on this branch. Fills the disk of a 145G VM until it has the free space of a 72G VM, to test
  whether the combined fixes fit. Free space targets are with the images pulled, and were observed on a 72G VM:
  18G with the current cleanup, and an expected 31G with the additional cleanup.
  scripts/testing/distributed_bats_lib.bash prunes the Docker build cache on this branch.

on:
  push:
    branches: [ ls/disk-exp-combined ]

jobs:
  get-tag:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.hash.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: hash
        run: echo "tag=$(scripts/hash_dependencies.sh)" >> "$GITHUB_OUTPUT"

  simulated-small-vm:
    name: "Small VM ${{ matrix.name }}"
    needs: [ get-tag ]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The control has none of the fixes except pruning, and should fail like a real 72G VM does.
          - name: control libcxx Debug
            stdlib: libcxx
            build_type: Debug
            extra_cleanup: false
            free_gb: 18
            flags: ""
          - name: fixes libcxx Debug
            stdlib: libcxx
            build_type: Debug
            extra_cleanup: true
            free_gb: 31
            flags: "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--compress-debug-sections=zstd"
          - name: fixes libstdcxx Debug
            stdlib: libstdcxx
            build_type: Debug
            extra_cleanup: true
            free_gb: 31
            flags: "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--compress-debug-sections=zstd"
          - name: fixes libstdcxx Benchmark
            stdlib: libstdcxx
            build_type: Benchmark
            extra_cleanup: true
            free_gb: 31
            flags: "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--compress-debug-sections=zstd"
    env:
      IMAGE: nebulastream/nes-ci:${{ needs.get-tag.outputs.tag }}-${{ matrix.stdlib }}-none
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/steps/setup-sccache
        with:
          bucket: ${{ secrets.SCCACHE_CACHE_BUCKET }}
          endpoint: ${{ secrets.SCCACHE_CACHE_ENDPOINT }}
          access_key: ${{ secrets.SCCACHE_CACHE_ACCESS_KEY }}
          secret_key: ${{ secrets.SCCACHE_CACHE_SECRET_KEY }}
      - uses: ./.github/steps/prepare-github
        with:
          images: |
            ${{ env.IMAGE }}
            nebulastream/nes-runtime-base:${{ needs.get-tag.outputs.tag }}
            eclipse-mosquitto:2
            apache/kafka:3.8.0
            busybox:1.38.0
          docker_username: ${{ secrets.DOCKER_USER_NAME }}
          docker_password: ${{ secrets.DOCKER_SECRET }}
      - name: Additional Cleanup
        if: ${{ matrix.extra_cleanup }}
        run: |
          sudo rm -rf /usr/share/swift /usr/local/.ghcup /usr/local/julia* /opt/google/chrome /opt/microsoft/msedge \
            /usr/local/share/chromium /opt/hostedtoolcache
          df -h /
      - name: Simulate Small VM
        run: |
          free_gb=$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')
          sudo fallocate -l "$((free_gb - ${{ matrix.free_gb }}))G" /simulated-small-vm
          df -h /
      - uses: ./.github/steps/run-in-container
        name: CMake Build
        with:
          image_name: ${{ env.IMAGE }}
          run: |
            source .github/.env/test-none.env
            sccache --start-server
            cmake -GNinja -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DALL_HASHMAP_TESTS=1 -DNES_LOG_LEVEL=DEBUG -DNES_SPLIT_TEST_BINARIES=OFF -DENABLE_DOCKER_TESTS=ON ${{ matrix.flags }}
            cmake --build build -j -- -k 0
            sccache --stop-server
      - uses: ./.github/steps/report-disk-usage
        name: Disk Usage After Build
        if: ${{ !cancelled() }}
      - uses: ./.github/steps/disk-watchdog
        name: Start Disk Watchdog
      - uses: ./.github/steps/run-in-container
        name: Run Unit Tests
        with:
          image_name: ${{ env.IMAGE }}
          run: |
            source .github/.env/test-none.env
            ctest --test-dir build --no-tests=error -j -LE "Systest|DockerCompose" --output-on-failure --timeout 2400 ${ADDITIONAL_CTEST_ARGS}
      - uses: ./.github/steps/report-disk-usage
        name: Disk Usage After Unit Tests
        if: ${{ !cancelled() }}
      - uses: ./.github/steps/run-in-container
        name: Run System Tests
        with:
          image_name: ${{ env.IMAGE }}
          run: |
            source .github/.env/test-none.env
            ctest --test-dir build --no-tests=error -j -L Systest --output-on-failure --timeout 4800 ${ADDITIONAL_CTEST_ARGS}
      - uses: ./.github/steps/report-disk-usage
        name: Disk Usage After System Tests
        if: ${{ !cancelled() }}
      - uses: ./.github/steps/run-in-container
        name: Run Docker Tests
        with:
          image_name: ${{ env.IMAGE }}
          run: |
            source .github/.env/test-none.env
            ctest --test-dir build --no-tests=error -j 1 -L DockerCompose --output-on-failure --timeout 2400 ${ADDITIONAL_CTEST_ARGS}
      - uses: ./.github/steps/report-disk-usage
        name: Disk Usage After Docker Tests
        if: ${{ !cancelled() }}
      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@v5
        if: ${{ failure() && !cancelled() }}
        with:
          name: logs-${{ matrix.name }}
          path: |
            build/**/*.log
            build/**/*.stats
