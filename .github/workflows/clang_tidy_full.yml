name: Clang-Tidy
description: |
  This workflow computes a complete clang-tidy analysis based on the input head_sha.
  This workflow output a list of clang-tidy warnings and their frequency and fails if we encounter any clang-tidy
  warnings which have been flagged as errors.
on:
  workflow_call:
    inputs:
      dev_image_tag:
        required: true
        type: string
        description: "Docker image tag of the development image"
      head_sha:
        required: true
        description: "target commit"
        type: string

jobs:
  clang-tidy-full:
    # Due to limited ARM server capacity we only run on x64
    runs-on: [ self-hosted, linux, Build, x64 ]
    container:
      # TODO #401 Investigate rootless docker containers
      options: --user root
      image: nebulastream/nes-ci:${{ inputs.dev_image_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Configure CMake
        run: cmake -B build
      - name: Run clang-tidy
        id: run-clang-tidy
        # The target generates the code clang-tidy needs (nes-codegen), runs run-clang-tidy over every
        # translation unit and writes build/clang-tidy.log. Structural exclusions for generated
        # sources live in scripts/tidy.sh, shared with the local tidy-full target.
        run: cmake --build build --target tidy-full
      - name: show errors
        if: ${{ failure() && steps.run-clang-tidy.conclusion == 'failure' }}
        run: |
          echo "# clang-tidy errors" >> $GITHUB_STEP_SUMMARY
          echo       >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          cat build/clang-tidy.log | grep ": error:" | sort | uniq >> $GITHUB_STEP_SUMMARY

          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: summarize
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/clang-tidy-summary.py .clang-tidy build/clang-tidy.log --summary-json build/clang-tidy-summary.json >> $GITHUB_STEP_SUMMARY
      - name: Upload Test Summary
        uses: actions/upload-artifact@v5
        if: ${{ failure() && !cancelled() }}
        with:
          name: clang-tidy-logs
          path: build/clang-tidy*
