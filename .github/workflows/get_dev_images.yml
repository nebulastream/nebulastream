name: Dependency Image
description: |
   NebulaStream (NES) Docker Image Hierarchy
  
   This workflow creates a set of multi-architecture Docker images for the NebulaStream (NES) project.
   Here's how the images are structured:
  
   1. BASE IMAGES:
      - nebulastream/nes-development-base - Foundation image with LLVM toolchain and CMake
      - Available for both x64 and arm64 architectures
  
   2. SPECIALIZED IMAGES:
      Four main image types built on top of the base image:
      - development-dependency: Contains pre-built SDK based on vcpkg manifest
      - development: Full development environment with dependencies and dev tools like clang-format
      - ci: Optimized for continuous integration workflows
      - benchmark: Configured for performance benchmarking
  
   3. BUILD VARIANTS:
      Each specialized image has variants based on:
      - Architecture: x64, arm64 (arm64 is not available for libstdcxx)
      - Standard Library: libstdcxx, libcxx
      - Sanitizer: none, address, thread, undefined
  
   4. TAGGING SCHEMA:
      - Full tags: nebulastream/nes-[IMAGE_TYPE]:[TAG]-[ARCH]-[STDLIB]-[SANITIZER]
      - Multi-arch tags: nebulastream/nes-[IMAGE_TYPE]:[TAG]-[STDLIB]-[SANITIZER]
      - Branch-specific tags: nebulastream/nes-[IMAGE_TYPE]:[BRANCH_NAME]-[STDLIB]-[SANITIZER]
      - Shortcuts: nebulastream/nes-[IMAGE_TYPE]:[BRANCH_NAME] (defaults to libcxx-none)

   5. BUILD CACHE SYSTEM:
      - Cache images are stored in dedicated nes-[IMAGE_TYPE]-cache repositories
      - Builds import both the latest cache and the sanitized branch-specific cache
      - Builds export the updated cache to the sanitized branch-specific tag
  
   The workflow creates multi-architecture manifests that combine x64 and arm64 images
   where available, and adds convenience tags for common configurations.
   This enables developers to easily select the appropriate image for their
   development needs, CI pipelines, or benchmarking tasks.
  
   This workflow calculates the development image tag of a head_sha. If a requested development image does not exist
   yet the workflow will build it. Callers choose which standard libraries and sanitizers they need (`stdlibs`,
   `sanitizers`; by default all of them). Docker Hub is checked for every requested variant separately, and only the
   missing ones are built and published, so a caller that needs a single variant does not wait for all the others, and a
   later caller that needs more variants builds just the remaining ones.



on:
  workflow_call:
    inputs:
      branch-name:
        required: false
        type: string
        default: ${{ inputs.head_sha }}
        description: "Branch name to tag the docker image with"
      head_sha:
        required: true
        type: string
      stdlibs:
        required: false
        type: string
        default: '["libstdcxx","libcxx"]'
        description: "JSON array of the standard libraries to provide development images for"
      sanitizers:
        required: false
        type: string
        default: '["address","thread","undefined","none"]'
        description: "JSON array of the sanitizers to provide development images for"
    outputs:
      image-tag:
        description: "Docker image tag for the current dependencies"
        value: ${{ jobs.detect-dependency-changes.outputs.tag }}
      build-dependency:
        description: "If the dependencies were built"
        value: ${{ jobs.detect-dependency-changes.outputs.build-dependency }}
      branch-tag:
        description: "Sanitized branch name used for Docker image and cache tags"
        value: ${{ jobs.detect-dependency-changes.outputs.branch-name }}

jobs:

  detect-dependency-changes:
    # This job detects changes to files relevant for our dependency management by calculating a hash value
    # and looking for existing development images with the same hash, for each requested stdlib/sanitizer variant.
    # If we find the development images matching the hash we skip building new docker images; otherwise only the
    # missing variants are built.
    # This job also determines the development image tag used for building and testing
    name: Detect changes to dependencies
    outputs:
      build-dependency: ${{steps.hash-and-lookup.outputs.build-dependency}}
      variants: ${{ steps.hash-and-lookup.outputs.variants }}
      build-matrix: ${{ steps.hash-and-lookup.outputs.build-matrix }}
      tag: ${{ steps.hash-and-lookup.outputs.tag }}
      hash: ${{ steps.hash-and-lookup.outputs.hash }}
      branch-name: ${{ steps.sanitize.outputs.branch-name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Sanitize branch name for Docker tag
        id: sanitize
        shell: bash
        env:
          BRANCH_NAME: ${{ inputs.branch-name }}
        run: |
          # Docker tags allow only [a-zA-Z0-9._-] and max 128 chars.
          # Replace all invalid characters (e.g. '/') with '-', strip leading '.' or '-'.
          SANITIZED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/^[.-]*//' | cut -c1-128)
          echo "Sanitized branch name: '$BRANCH_NAME' -> '$SANITIZED'"
          echo "branch-name=$SANITIZED" >> "$GITHUB_OUTPUT"
      - name: Calculate and lookup hash
        id: hash-and-lookup
        env:
          STDLIBS: ${{ inputs.stdlibs }}
          SANITIZERS: ${{ inputs.sanitizers }}
        run: |
          HASH=$(scripts/hash_dependencies.sh)
          echo "Using Hash: $HASH"

          # Output the tag (hash) to GitHub Actions
          echo "tag=$HASH" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

          # The merged multi-arch ci image of a variant exists once all of the variant's images were built and merged.
          # Look for it for every requested variant, and collect the variants that are missing.
          missing='[]'
          for stdlib in $(jq -r '.[]' <<<"$STDLIBS"); do
            for sanitizer in $(jq -r '.[]' <<<"$SANITIZERS"); do
              variant_tag="$HASH-$stdlib-$sanitizer"
              DOCKERHUB_RESPONSE_CODE=$(curl --silent --output response.txt --write-out '%{http_code}\n' "https://hub.docker.com/v2/namespaces/nebulastream/repositories/nes-ci/tags/$variant_tag")
              echo "dockerhub response code for $variant_tag: $DOCKERHUB_RESPONSE_CODE"

              if [ "$DOCKERHUB_RESPONSE_CODE" -ge 500 ]; then
                echo "dockerhub internal server error"
                cat response.txt
                exit 1
              elif [ "$DOCKERHUB_RESPONSE_CODE" -eq 403 ]; then
                echo "dockerhub responded with 403: Forbidden?!"
                exit 2
              elif [ "$DOCKERHUB_RESPONSE_CODE" -eq 404 ]; then
                echo "Development image $variant_tag does not exist in the docker registry"
                missing=$(jq -c --arg stdlib "$stdlib" --arg sanitizer "$sanitizer" '. + [{stdlib: $stdlib, sanitizer: $sanitizer}]' <<<"$missing")
              elif [ "$DOCKERHUB_RESPONSE_CODE" -eq 200 ]; then
                echo "found image $variant_tag"
              else
                echo "unexpected docker response! HTTP Status $DOCKERHUB_RESPONSE_CODE"
                cat response.txt
                exit 3
              fi
            done
          done

          # One job per architecture and missing variant (there is no arm64 libstdcxx build).
          build_matrix=$(jq -c '{include: [.[] | . as $variant | ("x64", "arm64") as $arch
                                           | select(($arch == "arm64" and $variant.stdlib == "libstdcxx") | not)
                                           | {arch: $arch, stdlib: $variant.stdlib, sanitizer: $variant.sanitizer}]}' <<<"$missing")
          echo "Missing variants: $missing"
          echo "variants=$missing" >> "$GITHUB_OUTPUT"
          echo "build-matrix=$build_matrix" >> "$GITHUB_OUTPUT"
          if [ "$missing" = '[]' ]; then
            echo "build-dependency=false" >> "$GITHUB_OUTPUT"
          else
            echo "build-dependency=true" >> "$GITHUB_OUTPUT"
          fi

  # Artificial mutex as we need to have the concurrency in a job and not in the workflow.
  # Keeping concurrency in this inner 'lock' job means concurrent callers that resolve to the same
  # dependency tag queue up and build the image once, instead of cancelling each other.
  lock:
    if: needs.detect-dependency-changes.outputs.build-dependency == 'true'
    needs: [ detect-dependency-changes ]
    runs-on: ubuntu-latest
    concurrency:
      group: build-dev-image-lock-${{ needs.detect-dependency-changes.outputs.tag }}
      cancel-in-progress: false
    steps:
      - run: echo "Acquired lock for ${{ needs.detect-dependency-changes.outputs.tag }}"

  build-runtime-image:
    name: "Build Runtime Base Image"
    needs: [ detect-dependency-changes, lock ]
    if: needs.detect-dependency-changes.outputs.build-dependency == 'true'
    runs-on: [ self-hosted, linux, Build, "${{ matrix.arch }}", dep-builder ]
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_SECRET }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: nebulastream/nes-runtime-base:${{ needs.detect-dependency-changes.outputs.tag }}-${{ matrix.arch }}
          context: .
          file: docker/runtime/RuntimeBase.dockerfile

  build-dev-images:
    # We run the docker image build on separate machines and combine them into a single
    # multi-arch docker image in the docker-development-images job.
    # This job builds a Base image which contains the llvm based toolchain and a recent
    # CMake version
    # The Dependency Image contains a pre-built sdk based on the vcpkg manifest
    # The Development Image contains the dependencies and additional tooling like clang-format.
    name: "Build Dev Images"
    needs: [ detect-dependency-changes, lock ]
    if: needs.detect-dependency-changes.outputs.build-dependency == 'true'
    runs-on: [ self-hosted, linux, Build, "${{ matrix.arch }}", dep-builder ]
    concurrency:
      group: build-dev-image-lock-${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
      # To reduce the amount of work, i.e., building the same deps multiple times, we only allow one job to continue.
      # We do not cancel the in progress one, as it might have run for quite some time and is close to finishing.
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # arch x stdlib x sanitizer of the variants that are missing for the requested set (see detect-dependency-changes)
      matrix: ${{ fromJSON(needs.detect-dependency-changes.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_SECRET }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Base Image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: nebulastream/nes-development-base:${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}
          cache-from: |
            type=registry,ref=nebulastream/nes-development-base-cache:latest-${{matrix.arch}}
            type=registry,ref=nebulastream/nes-development-base-cache:${{needs.detect-dependency-changes.outputs.branch-name}}-${{matrix.arch}}
          cache-to: type=registry,ref=nebulastream/nes-development-base-cache:${{needs.detect-dependency-changes.outputs.branch-name}}-${{matrix.arch}},mode=max
          context: .
          file: docker/dependency/Base.dockerfile
      - name: Build Dependency Image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: nebulastream/nes-development-dependency:${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
          cache-from: |
            type=registry,ref=nebulastream/nes-development-dependency-cache:latest-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
            type=registry,ref=nebulastream/nes-development-dependency-cache:${{needs.detect-dependency-changes.outputs.branch-name}}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
          cache-to: type=registry,ref=nebulastream/nes-development-dependency-cache:${{needs.detect-dependency-changes.outputs.branch-name}}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}},mode=max
          build-args: |
            TAG=${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}
            ARCH=${{matrix.arch}}
            STDLIB=${{matrix.stdlib}}
            SANITIZER=${{matrix.sanitizer}}
            VCPKG_DEPENDENCY_HASH=${{ needs.detect-dependency-changes.outputs.hash }}
          context: .
          file: docker/dependency/Dependency.dockerfile
          secrets: |
            VCPKG_CACHE_ACCESS_KEY=${{secrets.VCPKG_CACHE_ACCESS_KEY}}
            VCPKG_CACHE_SECRET_KEY=${{secrets.VCPKG_CACHE_SECRET_KEY}}
            VCPKG_CACHE_ENDPOINT=${{secrets.VCPKG_CACHE_ENDPOINT}}
            VCPKG_CACHE_BUCKET=${{secrets.VCPKG_CACHE_BUCKET}}
            VCPKG_CACHE_REGION=${{secrets.VCPKG_CACHE_REGION}}
      - name: Build Development Image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: nebulastream/nes-development:${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
          cache-from: |
            type=registry,ref=nebulastream/nes-development-cache:latest-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
            type=registry,ref=nebulastream/nes-development-cache:${{needs.detect-dependency-changes.outputs.branch-name}}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
          cache-to: type=registry,ref=nebulastream/nes-development-cache:${{needs.detect-dependency-changes.outputs.branch-name}}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}},mode=max
          build-args: TAG=${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
          context: .
          file: docker/dependency/Development.dockerfile
      - name: Build CI Image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: nebulastream/nes-ci:${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
          build-args: TAG=${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}-${{matrix.stdlib}}-${{matrix.sanitizer}}
          context: .
          file: docker/dependency/DevelopmentCI.dockerfile
      - name: Build benchmark image
        if: ${{matrix.sanitizer == 'none'}}
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: nebulastream/nes-benchmark:${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}-${{matrix.stdlib}}
          build-args: TAG=${{ needs.detect-dependency-changes.outputs.tag }}-${{matrix.arch}}-${{matrix.stdlib}}-none
          context: .
          file: docker/dependency/Benchmark.dockerfile
  merge-dev-images:
    # This Job merges platform specific images into a single multi-platform image
    name: "Merge Dev Images"
    needs: [ build-dev-images, build-runtime-image, detect-dependency-changes ]
    if: needs.detect-dependency-changes.outputs.build-dependency == 'true' && needs.build-dev-images.result == 'success' && needs.build-runtime-image.result == 'success'
    runs-on: [ self-hosted, linux, Build, x64 ]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - name: Login to Docker Hub
        if: ${{ !github.event.act }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_SECRET }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Combine Manifests
        shell: bash
        env:
          TAG: ${{ needs.detect-dependency-changes.outputs.tag }}
          VARIANTS: ${{ needs.detect-dependency-changes.outputs.variants }}
        run: |
          deadline=$((SECONDS + 600))
          retry_merge() {
            local delay=1 remaining
            until docker buildx imagetools create "$@"; do
              remaining=$((deadline - SECONDS))
              if ((remaining <= 0)); then
                echo "Timed out merging $1" >&2
                return 1
              fi
              if ((delay > remaining)); then delay=$remaining; fi
              echo "Retrying merge of $1 in ${delay}s" >&2
              sleep "$delay"
              if ((delay < 60)); then delay=$((delay * 2)); fi
              if ((delay > 60)); then delay=60; fi
            done
          }

          pids=()
          merge() { retry_merge "$@" & pids+=("$!"); }

          # Merges the per-architecture images of $1 (name) with tag $2 into one tag: x64 and arm64 for libcxx,
          # x64 only for libstdcxx.
          merge_arches() {
            local name=$1 tag=$2 stdlib=$3
            if [ "$stdlib" = libcxx ]; then
              merge -t "nebulastream/$name:$tag" "nebulastream/$name:$tag-x64" "nebulastream/$name:$tag-arm64"
            else
              merge -t "nebulastream/$name:$tag" "nebulastream/$name:$tag-x64"
            fi
          }

          merge -t nebulastream/nes-development-base:$TAG \
            nebulastream/nes-development-base:$TAG-x64 \
            nebulastream/nes-development-base:$TAG-arm64

          merge -t nebulastream/nes-runtime-base:$TAG \
            nebulastream/nes-runtime-base:$TAG-x64 \
            nebulastream/nes-runtime-base:$TAG-arm64

          # Only the variants that were built in this run.
          while read -r stdlib sanitizer; do
            for image_tag in development-dependency development ci; do
              merge_arches "nes-$image_tag" "$TAG-$stdlib-$sanitizer" "$stdlib"
            done
            # The benchmark image only exists for the unsanitized variants.
            if [ "$sanitizer" = none ]; then
              merge_arches nes-benchmark "$TAG-$stdlib" "$stdlib"
            fi
          done < <(jq -r '.[] | "\(.stdlib) \(.sanitizer)"' <<<"$VARIANTS")

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          exit "$failed"

      - name: Combine Manifests for branch specific docker image
        if: ${{ inputs.branch-name != '' }}
        shell: bash
        env:
          TAG: ${{ needs.detect-dependency-changes.outputs.tag }}
          BRANCH: ${{ needs.detect-dependency-changes.outputs.branch-name }}
          VARIANTS: ${{ needs.detect-dependency-changes.outputs.variants }}
        run: |
          docker buildx imagetools create -t nebulastream/nes-development-base:$BRANCH \
            nebulastream/nes-development-base:$TAG

          docker buildx imagetools create -t nebulastream/nes-runtime-base:$BRANCH \
            nebulastream/nes-runtime-base:$TAG

          while read -r stdlib sanitizer; do
            for image_tag in development-dependency development ci; do
              docker buildx imagetools create -t nebulastream/nes-$image_tag:$BRANCH-$stdlib-$sanitizer \
                nebulastream/nes-$image_tag:$TAG-$stdlib-$sanitizer
            done
            if [ "$sanitizer" = none ]; then
              docker buildx imagetools create -t nebulastream/nes-benchmark:$BRANCH-$stdlib \
                nebulastream/nes-benchmark:$TAG-$stdlib
            fi
          done < <(jq -r '.[] | "\(.stdlib) \(.sanitizer)"' <<<"$VARIANTS")

      - name: Create shortcut images
        if: ${{ inputs.branch-name != '' }}
        shell: bash
        env:
          TAG: ${{ needs.detect-dependency-changes.outputs.tag }}
          BRANCH: ${{ needs.detect-dependency-changes.outputs.branch-name }}
          VARIANTS: ${{ needs.detect-dependency-changes.outputs.variants }}
        run: |
          # The shortcuts without a standard library resolve to libcxx, and without a sanitizer to the unsanitized
          # variant. A shortcut is only created when its target was built in this run; otherwise it already exists
          # from the run that built the target.
          while read -r stdlib sanitizer; do
            [ "$stdlib" = libcxx ] || continue
            for image_tag in development-dependency development ci; do
              docker buildx imagetools create -t nebulastream/nes-$image_tag:$BRANCH-$sanitizer \
                nebulastream/nes-$image_tag:$TAG-libcxx-$sanitizer
              if [ "$sanitizer" = none ]; then
                docker buildx imagetools create -t nebulastream/nes-$image_tag:$BRANCH \
                  nebulastream/nes-$image_tag:$TAG-libcxx-none
                docker buildx imagetools create -t nebulastream/nes-$image_tag:$TAG \
                  nebulastream/nes-$image_tag:$TAG-libcxx-none
              fi
            done
            if [ "$sanitizer" = none ]; then
              docker buildx imagetools create -t nebulastream/nes-development:$BRANCH-libcxx \
                nebulastream/nes-development:$TAG-libcxx-none
              docker buildx imagetools create -t nebulastream/nes-benchmark:$TAG \
                nebulastream/nes-benchmark:$TAG-libcxx
              docker buildx imagetools create -t nebulastream/nes-benchmark:$BRANCH \
                nebulastream/nes-benchmark:$TAG-libcxx
            fi
          done < <(jq -r '.[] | "\(.stdlib) \(.sanitizer)"' <<<"$VARIANTS")
