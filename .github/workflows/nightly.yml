name: NES Nightly (disk experiment, release-only vcpkg)
description: |
  Temporary, only on this branch. Builds the dependency images with release-only vcpkg libraries, then runs the PR test
  matrix against them. Does not notify anyone or publish release images.

on:
  workflow_dispatch:

jobs:
  fetch-current-commit:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ github.sha }}
    steps:
      - run: echo "${{ github.sha }}"

  get-dev-images:
    needs: fetch-current-commit
    uses: ./.github/workflows/get_dev_images.yml
    secrets: inherit
    with:
      head_sha: ${{ needs.fetch-current-commit.outputs.sha }}

  build-and-test:
    name: "Run build and test"
    needs: [ fetch-current-commit, get-dev-images ]
    uses: ./.github/workflows/build_and_test.yml
    secrets: inherit
    with:
      head_sha: ${{ needs.fetch-current-commit.outputs.sha }}
      dev_image_tag: ${{ needs.get-dev-images.outputs.image-tag }}
      matrix_profile: pr
