name: Flaky Hunt
description: |
  Reduced nightly (tests, large tests and distributed e2e; no long-running or deterministic jobs) to spot flaky tests.
  This file REPLACES nightly.yml on a throw-away branch (GitHub only dispatches workflows that exist on main and runs
  the version on the given ref). The branch only carries CI config; the code under test is `head_sha` (default main).
  Dispatched repeatedly by tools/flaky_monitor.py. Never builds/pushes images, never notifies anyone.

on:
  workflow_dispatch:
    inputs:
      head_sha:
        required: false
        default: 'main'
        description: "branch/sha whose code is tested"

jobs:
  fetch-sha:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.fetch-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha || 'main' }}
      - id: fetch-sha
        run: echo "sha=$(git rev-parse --verify HEAD)" >> "$GITHUB_OUTPUT"

  # Lookup only: fails if the dependency image of head_sha does not exist (the regular nightly/PR workflows create it).
  get-dev-images:
    needs: fetch-sha
    runs-on: ubuntu-24.04
    outputs:
      image-tag: ${{ steps.lookup.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.fetch-sha.outputs.sha }}
      - id: lookup
        run: |
          HASH=$(scripts/hash_dependencies.sh)
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/namespaces/nebulastream/repositories/nes-ci/tags/$HASH")
          [ "$code" = 200 ] || { echo "dev image $HASH not on Docker Hub (HTTP $code); not building it here"; exit 1; }
          echo "tag=$HASH" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: [ fetch-sha, get-dev-images ]
    uses: ./.github/workflows/build_and_test.yml
    secrets: inherit
    with:
      head_sha: ${{ needs.fetch-sha.outputs.sha }}
      config_ref: ${{ github.sha }}  # the flaky matrix profile only exists on this branch
      dev_image_tag: ${{ needs.get-dev-images.outputs.image-tag }}
      matrix_profile: flaky
      test_budget_minutes: 60   # a job whose tests run into this fails (counted from job start); large tests: 40 min
      timeout_minutes: 120      # hard cap, only reached by a hung build/step

  # Large scale tests + distributed e2e (systest remote test); ~15-25 min each.
  large-tests:
    name: "Large Scale Tests (${{ matrix.name }})"
    needs: [ fetch-sha, get-dev-images ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: slice-cache-enabled
            enable_slice_cache: true
          - name: slice-cache-disabled
            enable_slice_cache: false
    uses: ./.github/workflows/large_test.yml
    secrets: inherit
    with:
      head_sha: ${{ needs.fetch-sha.outputs.sha }}
      dev_image_tag: ${{ needs.get-dev-images.outputs.image-tag }}
      enable_slice_cache: ${{ matrix.enable_slice_cache }}

  # new random worker config on every run
  large-tests-random-config:
    name: Large Scale Tests Random Worker Config
    needs: [ fetch-sha, get-dev-images ]
    uses: ./.github/workflows/large_tests_random_worker_config.yml
    secrets: inherit
    with:
      head_sha: ${{ needs.fetch-sha.outputs.sha }}
      dev_image_tag: ${{ needs.get-dev-images.outputs.image-tag }}
