name: NES PR CI Merge
on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  get-dev-images:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/get_dev_images.yml
    secrets: inherit
    with:
      branch-name: ${{ github.head_ref }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  run_code_coverage:
    if: github.event.pull_request.merged == true
    needs: [ get-dev-images ]
    name: "Run Code Coverage"
    uses: ./.github/workflows/code_coverage.yml
    with:
      head_sha: ${{ github.event.pull_request.merge_commit_sha }}
      dev_image_tag: ${{ needs.get-dev-images.outputs.image-tag }}
      branch-name: 'main'
    secrets: inherit

  check-and-update-development-images:
    # This job is executed when a PR is merged into the main branch.
    # If changes to the dependencies are detected we update the `latest`
    # tag of our development images to the docker images built with the
    # updated dependencies.
    runs-on: [ self-hosted, linux, Build ]
    needs: [ get-dev-images ]
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - uses: actions/checkout@v5
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            vcpkg/**
            docker/dependency/**
            docker/runtime/**
            nes-network/**/Cargo.toml
            nes-network/**/Cargo.lock
      - name: Login to Docker Hub
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_SECRET }}
      - name: Set up Docker Buildx
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Retag Base Image
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          docker buildx imagetools create -t nebulastream/nes-development-base:latest \
            nebulastream/nes-development-base:${{ needs.get-dev-images.outputs.image-tag }}

      - name: Retag Specialized Images
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Iterate through each image type
          for image_tag in development-dependency development ci; do
            docker buildx imagetools create -t nebulastream/nes-$image_tag:latest \
              nebulastream/nes-$image_tag:${{ needs.get-dev-images.outputs.image-tag }}
          
            docker buildx imagetools create -t nebulastream/nes-$image_tag:latest-libcxx \
              nebulastream/nes-$image_tag:${{ needs.get-dev-images.outputs.image-tag }}-libcxx-none
          
            for stdlib in libcxx libstdcxx; do
              for sanitizer in none address thread undefined; do
                docker buildx imagetools create -t nebulastream/nes-$image_tag:latest-$stdlib-$sanitizer \
                  nebulastream/nes-$image_tag:${{ needs.get-dev-images.outputs.image-tag }}-$stdlib-$sanitizer
              done
            done

            # the stdlib-less shortcut resolves to libcxx, matching the shortcut tags in get_dev_images.yml
            for sanitizer in none address thread undefined; do
              docker buildx imagetools create -t nebulastream/nes-$image_tag:latest-$sanitizer \
                nebulastream/nes-$image_tag:${{ needs.get-dev-images.outputs.image-tag }}-libcxx-$sanitizer
            done
          done
          
          docker buildx imagetools create -t nebulastream/nes-benchmark:latest \
            nebulastream/nes-benchmark:${{ needs.get-dev-images.outputs.image-tag }}

      - name: Promote Branch Caches to Latest
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          for arch in x64 arm64; do
            docker buildx imagetools create \
              -t nebulastream/nes-development-base-cache:latest-$arch \
              nebulastream/nes-development-base-cache:${{ needs.get-dev-images.outputs.branch-tag }}-$arch
          done

          for image_tag in development-dependency development; do
            for arch in x64 arm64; do
              for stdlib in libcxx libstdcxx; do
                if [[ "$arch" == "arm64" && "$stdlib" == "libstdcxx" ]]; then
                  continue
                fi

                for sanitizer in none address thread undefined; do
                  docker buildx imagetools create \
                    -t nebulastream/nes-$image_tag-cache:latest-$arch-$stdlib-$sanitizer \
                    nebulastream/nes-$image_tag-cache:${{ needs.get-dev-images.outputs.branch-tag }}-$arch-$stdlib-$sanitizer
                done
              done
            done
          done
