name: Flaky Hunt
description: |
  Reduced nightly (tests, large tests and distributed e2e; no long-running or deterministic jobs) to spot flaky tests.
  Meant to live on a throw-away branch and be dispatched repeatedly by tools/flaky_monitor.py.
  Tests the commit it is dispatched on (the branch tip = main + these CI changes).

on:
  workflow_dispatch:

jobs:
  # Lookup only: never builds or pushes images. Fails if main's dependency image does not exist yet
  # (the regular nightly/PR workflows create it).
  get-dev-images:
    runs-on: ubuntu-24.04
    outputs:
      image-tag: ${{ steps.lookup.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: lookup
        run: |
          HASH=$(scripts/hash_dependencies.sh)
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/namespaces/nebulastream/repositories/nes-ci/tags/$HASH")
          [ "$code" = 200 ] || { echo "dev image $HASH not on Docker Hub (HTTP $code); not building it here"; exit 1; }
          echo "tag=$HASH" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: get-dev-images
    uses: ./.github/workflows/build_and_test.yml
    secrets: inherit
    with:
      head_sha: ${{ github.sha }}
      dev_image_tag: ${{ needs.get-dev-images.outputs.image-tag }}
      matrix_profile: flaky

  # Large scale tests + distributed e2e (systest remote test); ~15-25 min each.
  large-tests:
    name: "Large Scale Tests (${{ matrix.name }})"
    needs: get-dev-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: slice-cache-enabled
            enable_slice_cache: true
          - name: slice-cache-disabled
            enable_slice_cache: false
    uses: ./.github/workflows/large_test.yml
    secrets: inherit
    with:
      head_sha: ${{ github.sha }}
      dev_image_tag: ${{ needs.get-dev-images.outputs.image-tag }}
      enable_slice_cache: ${{ matrix.enable_slice_cache }}

  # new random worker config on every run
  large-tests-random-config:
    name: Large Scale Tests Random Worker Config
    needs: get-dev-images
    uses: ./.github/workflows/large_tests_random_worker_config.yml
    secrets: inherit
    with:
      head_sha: ${{ github.sha }}
      dev_image_tag: ${{ needs.get-dev-images.outputs.image-tag }}
