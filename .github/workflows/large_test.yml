name: Build and Run Large Tests
description: This workflow builds and tests a head_sha, on a combination of different architectures and standard libraries.
on:
  workflow_call:
    inputs:
      dev_image_tag:
        required: true
        type: string
        description: "Docker image tag of the development image"
      head_sha:
        type: string
        required: true
        description: "head_sha of the branch"
      number_of_worker_threads:
        type: string
        description: "Number of worker threads the large scale tests should be run with"
        default: 4
      buffer_size:
        type: string
        description: "Buffer size the large scale tests should be run with"
        default: 4096
      page_size:
        type: string
        description: "Page size the large scale tests should be run with"
        default: 4096
      number_of_partitions:
        type: string
        description: "Number of partitions large scale tests should be run with"
        default: 128
      total_memory_in_bytes:
        type: string
        description: "Total memory budget in bytes for the global buffer pool (pooled + unpooled)"
        default: "76911476736"
      enable_slice_cache:
        type: boolean
        description: "Enable slice cache for the large scale tests"
        default: true

jobs:
  build-and-test-linux:
    name: "Run large scale tests on ${{matrix.arch}} with ${{matrix.stdlib}} in ${{ matrix.build_type }}"
    container:
      image: nebulastream/nes-ci:${{ inputs.dev_image_tag }}-${{ matrix.stdlib }}-${{ matrix.sanitizer }}
      volumes:
        - test-file-cache:/test-file-cache
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        MOLD_JOBS: 1
      # TODO #401 Investigate rootless docker containers
      options: --user root
    timeout-minutes: 40
    runs-on: [ self-hosted, linux, Build, "${{matrix.arch}}" ]
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64 ]
        stdlib: [ 'libcxx' ]
        sanitizer: [ 'none' ]
        build_type: [ 'RelWithDebInfo', 'Release' ]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: ./.github/steps/setup-sccache
        with:
          bucket: ${{ secrets.SCCACHE_CACHE_BUCKET }}
          endpoint: ${{ secrets.SCCACHE_CACHE_ENDPOINT }}
          access_key: ${{ secrets.SCCACHE_CACHE_ACCESS_KEY }}
          secret_key: ${{ secrets.SCCACHE_CACHE_SECRET_KEY }}
      - name: Configure NebulaStream
        run: |
          sccache --start-server
          sccache --show-stats
          cmake -GNinja -B build -DUSE_SANITIZER=${{ matrix.sanitizer }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_LARGE_TESTS=ON -DExternalData_OBJECT_STORES=/test-file-cache -DNES_LOG_LEVEL=DEBUG \
            -DLARGE_TEST_WORKER_THREADS=${{ inputs.number_of_worker_threads }} \
            -DLARGE_TEST_BUFFER_SIZE=${{ inputs.buffer_size }} \
            -DLARGE_TEST_PAGE_SIZE=${{ inputs.page_size }} \
            -DLARGE_TEST_NUMBER_OF_PARTITIONS=${{ inputs.number_of_partitions }} \
            -DLARGE_TEST_TOTAL_MEMORY_BYTES=${{ inputs.total_memory_in_bytes }} \
            -DLARGE_TEST_ENABLE_SLICE_CACHE=${{ inputs.enable_slice_cache }}
      - name: Build NebulaStream
        run: |
          sccache --show-stats
          cmake --build build --target systest -j
          sccache --show-stats
          sccache --stop-server
      - name: Run large System Level Tests
        run: |
          echo "Running all large tests with: "
          echo " - NUMBER_OF_WORKER_THREADS: ${{ inputs.number_of_worker_threads }}"
          echo " - BUFFER_SIZE: ${{ inputs.buffer_size }}"
          echo " - PAGE_SIZE: ${{ inputs.page_size }}"
          echo " - NUMBER_OF_PARTITIONS: ${{ inputs.number_of_partitions }}"

          # The worker config above is baked into the CTest entries at configure time, so the large tests run through
          # ctest and pick up the systest directories that plugins register via --testLocations.
          ctest --test-dir build --output-on-failure -L LargeTest

      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@v5
        if: failure() && !github.event.act
        with:
          name: test-logs-${{ matrix.arch }}-${{ matrix.stdlib }}-${{ matrix.build_type }}
          path: build/nes-systests/SystemTest_*.log

  systest-remote-test:
    name: "Run systest remote test on ${{matrix.arch}} with ${{matrix.stdlib}}"
    container:
      image: nebulastream/nes-ci:${{ inputs.dev_image_tag }}-${{ matrix.stdlib }}-${{ matrix.sanitizer }}
      volumes:
        - ccache:/ccache
        - test-file-cache:/test-file-cache
        - /var/run/docker.sock:/var/run/docker.sock
      env:
        CCACHE_DIR: /ccache
        MOLD_JOBS: 1
      options: --user root
    timeout-minutes: 40
    runs-on: [ self-hosted, linux, Build, "${{matrix.arch}}", large-memory ]
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64 ]
        stdlib: [ 'libcxx' ]
        sanitizer: [ 'none' ]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
      - uses: ./.github/steps/setup-sccache
        with:
          bucket: ${{ secrets.SCCACHE_CACHE_BUCKET }}
          endpoint: ${{ secrets.SCCACHE_CACHE_ENDPOINT }}
          access_key: ${{ secrets.SCCACHE_CACHE_ACCESS_KEY }}
          secret_key: ${{ secrets.SCCACHE_CACHE_SECRET_KEY }}
      - name: Configure NebulaStream
        run: |
          sccache --start-server
          sccache --show-stats
          cmake -GNinja -B build -DUSE_SANITIZER=${{ matrix.sanitizer }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_LARGE_TESTS=ON -DExternalData_OBJECT_STORES=/test-file-cache -DLARGE_TEST_TOTAL_MEMORY_BYTES=76911476736
      - name: Build NebulaStream
        run: |
          sccache --show-stats
          cmake --build build --target systest nes-single-node-worker -j
          sccache --show-stats
          sccache --stop-server
      - name: Run systest remote test
        run: ctest --test-dir build --output-on-failure --timeout 2400 -R systest-remote-test
      - name: Upload Test Logs on Failure
        uses: actions/upload-artifact@v5
        if: failure() && !github.event.act
        with:
          name: systest-remote-test-logs-${{ matrix.arch }}-${{ matrix.stdlib }}
          path: build/test-tmp/
