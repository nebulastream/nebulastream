name: NES PR CI
description: |
  Orchestrator for every pull request. Runs the classify gate once, then dispatches the reusable
  code pipeline (pr_code.yml) and/or docs pipeline (pr_docs.yml) depending on what changed, and owns
  the two required-status gates ("Code CI Done" / "Docs CI Done").
on:
  pull_request:
    types: [ synchronize, opened, reopened, edited ]
  merge_group:
    branches: [ main ]

# cancel previous runs of same PR / branch.
# In merge_group runs github.head_ref is empty, so fall back to github.ref (the unique
# gh-readonly-queue ref) to avoid queued runs cancelling each other.
# A title/body edit ('edited' without a base change) dispatches nothing (see the code/docs job
# gates), but concurrency is evaluated before those gates — so isolate those runs in a unique group,
# otherwise cancel-in-progress would kill a legit in-progress build before the skip even happens.
concurrency:
  # run_id suffix gives no-op edits a private group; drop it if 'edited' is ever removed from triggers.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-pr${{ (github.event.action == 'edited' && github.event.changes.base == null) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # Classify the PR diff once (see .github/ci/full-ci-skip-paths.txt) and hand the result to the two
  # pipelines below. A docs-only PR skips pr_code.yml; a code-only PR skips pr_docs.yml.
  classify:
    runs-on: ubuntu-24.04
    outputs:
      hasCodeChanges: ${{ steps.classify.outputs.hasCodeChanges }}
      hasDocChanges: ${{ steps.classify.outputs.hasDocChanges }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so tj-actions can diff base_sha..sha; a shallow clone yields an empty diff.
          fetch-depth: 0
      - id: classify
        uses: ./.github/actions/classify-pr-changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

  # 'edited' fires on title/body/base changes; only (re)dispatch a pipeline when the base branch
  # changed. Also skipped when the classify gate found no changes of that kind.
  code:
    needs: [ classify ]
    if: ${{ (github.event.action != 'edited' || github.event.changes.base != null) && needs.classify.outputs.hasCodeChanges == 'true' }}
    uses: ./.github/workflows/pr_code.yml
    secrets: inherit

  docs:
    needs: [ classify ]
    if: ${{ (github.event.action != 'edited' || github.event.changes.base != null) && needs.classify.outputs.hasDocChanges == 'true' }}
    uses: ./.github/workflows/pr_docs.yml
    secrets: inherit

  # --- Required-check gates ---------------------------------------------------------------------
  # One required status check per pipeline. Each always runs (if: always()) so the context is always
  # created under a stable, top-level name — set "Code CI Done" / "Docs CI Done" as the required
  # status checks. Because they are top-level jobs here (not inside the reusable workflows) the
  # context names stay unprefixed; the reusable workflows' own jobs show up as "code / ..." etc.
  #
  # Each name is dynamic: a no-op title/body edit publishes under "... (skipped)", which is NOT the
  # required context — so editing the PR title (which dispatches nothing) can't turn a gate green
  # over failing code. The real run's green status on the same head SHA stays valid.
  code-ci-done:
    name: ${{ (github.event.action == 'edited' && github.event.changes.base == null) && 'Code CI Done (skipped)' || 'Code CI Done' }}
    needs: [ classify, code ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          HAS_CODE: ${{ needs.classify.outputs.hasCodeChanges }}
          # A title/body 'edited' event legitimately dispatches nothing; see the code job gate.
          NOOP_EDIT: ${{ github.event.action == 'edited' && github.event.changes.base == null }}
          CODE_RESULT: ${{ needs.code.result }}
        run: |
          # Fail-safe order: a broken classify must FAIL the gate, not silently pass it.
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::classify did not succeed: $CLASSIFY_RESULT"; exit 1
          fi
          if [ "$HAS_CODE" != "true" ]; then
            echo "No code changes — code CI legitimately skipped; passing."; exit 0
          fi
          if [ "$NOOP_EDIT" = "true" ]; then
            echo "No-op PR edit — nothing dispatched; passing."; exit 0
          fi
          if [ "$CODE_RESULT" = "success" ]; then
            echo "Code CI succeeded."; exit 0
          fi
          echo "::error::Code CI did not succeed: $CODE_RESULT"; exit 1

  docs-ci-done:
    name: ${{ (github.event.action == 'edited' && github.event.changes.base == null) && 'Docs CI Done (skipped)' || 'Docs CI Done' }}
    needs: [ classify, docs ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          HAS_DOCS: ${{ needs.classify.outputs.hasDocChanges }}
          NOOP_EDIT: ${{ github.event.action == 'edited' && github.event.changes.base == null }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::classify did not succeed: $CLASSIFY_RESULT"; exit 1
          fi
          if [ "$HAS_DOCS" != "true" ]; then
            echo "No doc changes — docs CI legitimately skipped; passing."; exit 0
          fi
          if [ "$NOOP_EDIT" = "true" ]; then
            echo "No-op PR edit — nothing dispatched; passing."; exit 0
          fi
          if [ "$DOCS_RESULT" = "success" ]; then
            echo "Docs CI succeeded."; exit 0
          fi
          echo "::error::Docs CI did not succeed: $DOCS_RESULT"; exit 1
