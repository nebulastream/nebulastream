# Topology:
#
# source-node-1 ─┐
#                ├── merge-node-1 ── sink-node
# source-node-2 ─┘

workers:
  - host: "sink-node:8080"
    data_address: "sink-node:9090"
    max_operators: 1
    config:
      worker:
        query_engine:
          number_of_worker_threads: 1

  - host: "merge-node-1:8080"
    data_address: "merge-node-1:9090"
    max_operators: 1
    downstream:
      - "sink-node:8080"
    config:
      worker:
        query_engine:
          number_of_worker_threads: 1

  - host: "source-node-2:8080"
    data_address: "source-node-2:9090"
    max_operators: 100
    downstream:
      - "merge-node-1:8080"
    config:
      worker:
        query_engine:
          number_of_worker_threads: 1

  - host: "source-node-1:8080"
    data_address: "source-node-1:9090"
    max_operators: 100
    downstream:
      - "merge-node-1:8080"
    config:
      worker:
        query_engine:
          number_of_worker_threads: 1

allow_source_placement:
  - "source-node-1:8080"
  - "source-node-2:8080"

allow_sink_placement:
  - "sink-node:8080"