query: |
  SELECT OCTET_LENGTH(ARRAY_AGG_PAGE_SORTED(CASTTOTYPE(sample AS FLOAT32))) AS bytes
  FROM (
    SELECT timestamp / UINT64(1000) AS timestamp, sample
    FROM audio_samples
  )
  WINDOW SLIDING(timestamp, SIZE 1000000 MS, ADVANCE BY 10000 MS)
  INTO VOID_SINK

sinks:
  - name: VOID_SINK
    host: localhost:8080
    schema:
      - { name: bytes, type: UINT64, nullable: false }
    type: Void
    config: { }

logical:
  - name: audio_samples
    schema:
      - { name: sample, type: FLOAT64, nullable: false }
      - { name: timestamp, type: UINT64, nullable: false }

physical:
  - logical: audio_samples
    host: localhost:8080
    type: File
    parser_config: { type: CSV, field_delimiter: "," }
    source_config:
      file_path: /home/ls/dima/nebulastream/benchmarks/array-agg-audio/audio-44khz-1gb.csv

workers:
  - host: localhost:8080
    data_address: localhost:9090
    max_operators: 10000
