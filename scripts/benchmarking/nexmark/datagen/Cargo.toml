# Standalone tool, deliberately not a member of the root workspace: it is not part of the NES build.
[workspace]

[package]
name = "nexmark-datagen"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nexmark = "=0.2.0"
clap = { version = "4", features = ["derive"] }
