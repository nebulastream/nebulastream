# Several failure modes with overlapping windows, while workers cycle and queries run throughout.
# The timeout leaves at least 45 s after the last fault ends,
# because a worker whose reconnect attempts ran out is retried only after 30 s.

[[test]]
title = "compound_failures"
timeout = 85

  # An initial pool, so every fault phase finds a worker to hit
  [[test.workload]]
  name = "Worker"
  num_ops = 6
  end = 4
  create_weight = 1
  drop_weight = 0

  # Workers continuously created and dropped throughout
  [[test.workload]]
  name = "Worker"
  num_ops = 27
  begin = 4
  end = 40
  create_weight = 3
  drop_weight = 1

  # Queries overlap with every fault phase
  [[test.workload]]
  name = "Query"
  num_ops = 18
  begin = 5
  end = 50
  create_weight = 3
  drop_weight = 1

  # Phase 1: network degrades while queries start
  [[test.workload]]
  name = "Degradation"
  begin = 8
  end = 18
  latency_lo_ms = 100
  latency_hi_ms = 1500
  loss_rate = 0.05

  # Phase 2: clogged workers overlap with degraded network
  [[test.workload]]
  name = "Clog"
  begin = 12
  end = 22
  clog_rate = 0.3

  # Phase 3: kill workers after the clogs heal, so fragments must recover
  [[test.workload]]
  name = "Attrition"
  begin = 20
  kill_rate = 0.3
  restart_delay_lo_secs = 2
  restart_delay_hi_secs = 8

  # Phase 4: stall surviving workers during recovery from attrition
  [[test.workload]]
  name = "Stall"
  begin = 25
  end = 40
  pause_rate = 0.2
