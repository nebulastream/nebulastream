# Worker-failure resilience under load.
# The test builds a pool of workers, accumulates queries on them, then kills and restarts a fraction of the workers in two waves.
# The second wave keeps its victims down long enough that the coordinator's reconnect attempts run out.
# The timeout leaves at least 45 s after the last fault ends,
# because a worker whose reconnect attempts ran out is retried only after 30 s.

[[test]]
title = "escalating_kill_waves"
timeout = 100

  # The pool is built without drops, so the first wave always has a worker to kill.
  [[test.workload]]
  name = "Worker"
  num_ops = 8
  end = 8
  create_weight = 1
  drop_weight = 0

  [[test.workload]]
  name = "Worker"
  num_ops = 14
  begin = 8
  end = 15
  create_weight = 4
  drop_weight = 1

  [[test.workload]]
  name = "Query"
  num_ops = 28
  begin = 5
  end = 65
  create_weight = 2
  drop_weight = 1

  # Wave 1: moderate
  [[test.workload]]
  name = "Attrition"
  begin = 10
  kill_rate = 0.4
  restart_delay_lo_secs = 1
  restart_delay_hi_secs = 5

  # Wave 2: aggressive, right after recovery, with a long outage
  [[test.workload]]
  name = "Attrition"
  begin = 25
  kill_rate = 0.6
  restart_delay_lo_secs = 20
  restart_delay_hi_secs = 30

