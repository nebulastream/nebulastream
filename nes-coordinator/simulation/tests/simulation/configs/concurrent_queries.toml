# Reproducer: two Query workloads that start at the same instant.
# Both resolve their first CreateQuery before the catalog has a source or a sink,
# so both send the source and sink prerequisites.
# The second CreateSink uses the same name without if_not_exists and is rejected.

[[test]]
title = "two_query_workloads"
timeout = 60

  [[test.workload]]
  name = "Worker"
  num_ops = 4
  end = 4
  create_weight = 1
  drop_weight = 0

  [[test.workload]]
  name = "Query"
  num_ops = 1
  begin = 5
  end = 5
  create_weight = 1
  drop_weight = 0

  [[test.workload]]
  name = "Query"
  num_ops = 1
  begin = 5
  end = 5
  create_weight = 1
  drop_weight = 0
