[[test]]
title = "busy_workers"
timeout = 90
min_queries_failed_by_worker_drop = 1

  [[test.workload]]
  name = "Worker"
  num_ops = 8
  end = 10
  create_weight = 1
  drop_weight = 0

  # The queries start once all workers exist, so their fragments are spread over the workers.
  [[test.workload]]
  name = "Query"
  num_ops = 6
  begin = 10
  end = 14
  create_weight = 1
  drop_weight = 0

  # Every worker without the source or the sink is dropped while the queries run.
  [[test.workload]]
  name = "Worker"
  num_ops = 8
  begin = 16
  end = 30
  create_weight = 0
  drop_weight = 1
