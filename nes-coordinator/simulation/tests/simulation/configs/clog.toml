# Each clog lasts up to 30 s, so some workers become reachable again before the coordinator marks them unreachable and some after.

[[test]]
title = "majority_unreachable"
timeout = 85

  [[test.workload]]
  name = "Worker"
  num_ops = 14
  end = 8
  create_weight = 1
  drop_weight = 0

  [[test.workload]]
  name = "Query"
  num_ops = 19
  begin = 6
  end = 42
  create_weight = 1
  drop_weight = 1

  [[test.workload]]
  name = "NodeFault"
  action = "Clog"
  rate = 0.6
  start = [10, 25]
  end = [25, 40]
