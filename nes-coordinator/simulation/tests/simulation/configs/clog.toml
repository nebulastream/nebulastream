# Workers become unreachable for a window and keep their fragments.
# Each clog lasts up to 30 s, so some workers come back before the coordinator's reconnect attempts run out and some after.
# The timeout leaves at least 45 s after the last fault ends,
# because a worker whose reconnect attempts ran out is retried only after 30 s.

[[test]]
title = "majority_unreachable"
timeout = 85

  [[test.workload]]
  name = "Worker"
  num_ops = 14
  end = 8
  create_weight = 1
  drop_weight = 0

  [[test.workload]]
  name = "Query"
  num_ops = 19
  begin = 6
  end = 42
  create_weight = 1
  drop_weight = 1

  [[test.workload]]
  name = "Clog"
  begin = 10
  end = 40
  clog_rate = 0.6
