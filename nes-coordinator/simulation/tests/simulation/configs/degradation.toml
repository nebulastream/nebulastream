# The timeout leaves at least 45 s after the last fault ends,
# because a worker whose reconnect attempts ran out is retried only after 30 s.

[[test]]
title = "degraded_during_worker_cycling"
timeout = 75

  # Workers cycling while the network is degraded
  [[test.workload]]
  name = "Worker"
  num_ops = 28
  end = 33
  create_weight = 2
  drop_weight = 1

  [[test.workload]]
  name = "Query"
  num_ops = 16
  begin = 5
  end = 33
  create_weight = 2
  drop_weight = 1

  [[test.workload]]
  name = "Degradation"
  begin = 5
  end = 28
  latency_lo_ms = 200
  latency_hi_ms = 3000
  loss_rate = 0.15
