# The timeout leaves at least 45 s after the last fault ends,
# because a worker whose reconnect attempts ran out is retried only after 30 s.

[[test]]
title = "prolonged_majority_pause"
timeout = 85

  [[test.workload]]
  name = "Worker"
  num_ops = 16
  end = 13
  create_weight = 1
  drop_weight = 0

  [[test.workload]]
  name = "Query"
  num_ops = 24
  begin = 6
  end = 45
  create_weight = 2
  drop_weight = 1

  # Half the workers frozen for a long window
  [[test.workload]]
  name = "Stall"
  begin = 12
  end = 38
  pause_rate = 0.5

