[package]
name = "model"
version = "0.1.0"
edition = "2024"

[dependencies]
sea-orm.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
sqlx.workspace = true
sea-orm-migration.workspace = true
# Test-support only: gated behind the `testing` feature (and enabled for this
# crate's own tests via the dev-dependency below), so the property-test
# generators and Arbitrary impls do not ship in a production build.
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
migration.workspace = true

[dev-dependencies]
test-strategy.workspace = true
proptest.workspace = true
proptest-derive.workspace = true

[features]
# Exposes the Arbitrary impls and generators to sibling crates' tests.
testing = ["dep:proptest", "dep:proptest-derive"]
