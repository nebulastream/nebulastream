baseURL = "https://docs.nebula.stream/"
languageCode = "en-US"
title = "NebulaStream Documentation"
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    style = "dracula"

[params]
  description = "NebulaStream is a general purpose, end-to-end data management system for the IoT."
  repo = "https://github.com/nebulastream/nebulastream"

# Pages are generated from docs/getting-started, docs/guide, and docs/development by the
# content adapters in content/*/_content.gotmpl, which read the plain markdown files
# through the assets mounts below. This keeps a single flat, frontmatter-free source of
# truth readable both on GitHub and on the site, with no separate copies to drift out of
# sync.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../getting-started"
    target = "assets/getting-started"
  [[module.mounts]]
    source = "../guide"
    target = "assets/guide"
  [[module.mounts]]
    source = "../development"
    target = "assets/development"
