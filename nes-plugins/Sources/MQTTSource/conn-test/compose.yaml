# The broker that the MQTT source subscribes to and the loader publishes to.
# The framework derives the connector endpoint, broker:1883, from the service name and its expose port.
services:
  broker:
    image: eclipse-mosquitto:2
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf
    expose: ["1883"]
    stop_grace_period: 0s
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "test", "-q", "1"]
      interval: 1s
      start_interval: 100ms
      timeout: 3s
      retries: 5
      start_period: 5s

configs:
  mosquitto_conf:
    # No persistence: every run starts from an empty broker.
    # No queue limit: the source is held back until the first FILL, so a large batch waits on the broker.
    content: |
      listener 1883
      allow_anonymous true
      max_queued_messages 0
