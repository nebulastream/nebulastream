# Topology:
#
#   ┌──────────────┐  GigE Vision  ┌─────────────────────────┐
#   │ fake-camera  │  ──────────▶  │  worker-1               │
#   │ 512x512 Mono8│               │  S: Video (selector 2)  │
#   │ 25 frames/s  │               │  K: File → results.csv  │
#   └──────────────┘               └─────────────────────────┘
#
#   The worker finds the camera by GigE Vision discovery and writes one line per frame (without the image).

query: |
  SELECT TIMESTAMP, WIDTH, HEIGHT, PIXEL_FORMAT FROM video INTO FRAMES
sinks:
  - name: FRAMES
    host: worker-1:8080
    schema:
      - name: TIMESTAMP
        type: UINT64
      - name: WIDTH
        type: UINT64
      - name: HEIGHT
        type: UINT64
      - name: PIXEL_FORMAT
        type: UINT64
    type: File
    config:
      file_path: results.csv
      output_format: CSV

logical:
  - name: video
    schema:
      - name: TIMESTAMP
        type: UINT64
      - name: WIDTH
        type: UINT64
      - name: HEIGHT
        type: UINT64
      - name: PIXEL_FORMAT
        type: UINT64
      - name: IMAGE
        type: VARSIZED

physical:
  - logical: video
    host: worker-1:8080
    type: Video
    parser_config:
      type: NATIVE
    source_config:
      SOURCE_SELECTOR: 2

workers:
  - host: worker-1:8080
    data_address: worker-1:9090
