# The loader uses only the stdlib,
# but uv requires a pyproject.toml in every conn-test/ directory of the workspace.
# The runner imports the loader as a loose module, so it is never built as a package.

[project]
name = "conntest-plugin-tcpsource"
version = "0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
