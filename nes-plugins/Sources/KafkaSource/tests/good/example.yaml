# Topology:
#
#   ┌──────────────┐          ┌─────────────────────────┐
#   │ kafka-broker │  consume │  worker-1  (cap: 10000) │
#   │ topic:       │  ──────▶ │  S: KAFKA_SOURCE        │
#   │ sensors (3p) │          │  K: FILE_SINK out.csv   │
#   └──────────────┘          └─────────────────────────┘
#
#   One Kafka source consumes all partitions of `sensors` as group `nes-sensors` and writes every
#   row to a CSV file in the worker's directory.

query: |
  SELECT
    *
  FROM
    SENSORS
  INTO
    OUT
sinks:
  - name: OUT
    host: worker-1:8080
    schema:
      - name: ID
        type: UINT64
      - name: VALUE
        type: UINT64
    type: File
    config:
      output_format: CSV
      file_path: out.csv
      append: true

logical:
  - name: SENSORS
    schema:
      - name: ID
        type: UINT64
      - name: VALUE
        type: UINT64

physical:
  - logical: SENSORS
    host: worker-1:8080
    parser_config:
      type: CSV
      field_delimiter: ","
    type: Kafka
    source_config:
      brokers: kafka-broker:9092
      topic: sensors
      group_id: nes-sensors
      auto_offset_reset: earliest
      flush_interval_ms: 100

workers:
  - host: worker-1:8080
    data_address: worker-1:9090
    max_operators: 10000
