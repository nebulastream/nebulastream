query: |
  SELECT * FROM GENERATOR INTO TCP
sinks:
  - name: TCP
    host: worker-1:8080
    schema:
      - name: number
        type: UINT64
    type: TCP
    config:
      output_format: CSV
      socket_host: tcp-client
      socket_port: 9000

logical:
  - name: GENERATOR
    schema:
      - name: NUMBER
        type: UINT64

physical:
  - logical: GENERATOR
    host: worker-1:8080
    parser_config:
      type: CSV
      field_delimiter: ","
    type: GENERATOR
    source_config:
      stop_generator_when_sequence_finishes: ALL
      generator_schema: |
        SEQUENCE UINT64 0 10 1

workers:
  - host: worker-1:8080
    data_address: worker-1:9090
    max_operators: 10000
