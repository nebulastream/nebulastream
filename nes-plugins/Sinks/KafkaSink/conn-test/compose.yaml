# The broker that the Kafka sink produces to and the loader reads back from.
services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # After its first request, a client connects to the address that the broker gives out for the listener that it reached.
      # The loader and the connector reach DIRECT.
      # In a link scenario, the connector reaches PROXIED through the fault proxy, which listens on the same port number,
      # so PROXIED gives out the proxy's address and the connector stays on the proxy.
      KAFKA_LISTENERS: DIRECT://:9092,PROXIED://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DIRECT://kafka:9092,PROXIED://toxiproxy:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DIRECT:PLAINTEXT,PROXIED:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DIRECT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # The broker creates its offsets topic for the first consumer group, which would otherwise be the loader's after the first test.
      # With the default 50 partitions, this took 5.5 s in CI,
      # and the broker held the next test's messages until they failed the sink's delivery timeout of 5 s.
      # The healthcheck creates the topic before the first test, and one partition makes that quick.
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The loader creates each test's topic, so a sink that produces to another topic fails.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    expose: ["9092"]
    stop_grace_period: 0s
    healthcheck:
      # Describing a group needs the group's coordinator, which exists once the broker has created its offsets topic.
      # Until then the command fails, and afterwards it reports that the group does not exist.
      # Each check starts a JVM, so once the broker is healthy the check runs only once a minute and leaves the CPU to the tests.
      # The start period covers the broker's start, so a broker that is not healthy by its end fails the run after one more check.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group conntest-healthcheck 2>&1 | grep -q 'does not exist'"]
      interval: 60s
      start_interval: 1s
      timeout: 10s
      retries: 1
      start_period: 120s
