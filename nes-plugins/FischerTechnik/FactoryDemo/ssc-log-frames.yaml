# SSClogFrames: logs every SSC (Sensor/Surveillance Camera, the pan/tilt
# USB camera mounted atop the MPO station) frame straight to disk, one row
# per frame. Stand-in for the FT Cloud's "take a snapshot" button, which
# only saves on demand and to a location the FT Cloud manages -- this
# gives us a local, continuous archive of the same i/cam feed instead.
# Same source config as ../tests/fischertechnik-cam.yaml; large enough
# worker.default_query_execution.operator_buffer_size is needed because
# each tuple's "data" field is a full base64 JPEG data-URI (320x240 @
# quality 30, ~1fps), several KB per tuple.
#
#   ┌──────────────────────────┐         ┌──────────────────────────┐
#   │ TXT 4.0 controller       │  ──▶    │  worker-1  (cap: 10000)  │
#   │ 192.168.0.10:1883        │ subscribe  S: MQTT_SOURCE x1         │
#   │ topic: i/cam             │         │  K: FILE_SINK x1          │
#   │ (SSC, pan/tilt USB cam   │         │  → ssc_log_frames.csv    │
#   │  atop MPO)               │         └──────────────────────────┘
#   └──────────────────────────┘

sinks:
  - name: SSC_LOG_FRAMES_SINK
    host: localhost:8080
    schema:
      - name: '"ts"'
        type: UINT64
      - name: '"data"'
        type: VARSIZED
    type: File
    config:
      output_format: CSV
      file_path: ssc_log_frames.csv

logical:
  - name: SSC_CAM
    schema:
      # ts=ISO-8601 UTC string (VARSIZED; cast to unix ms in the paired
      # query via CASTTOUNIXTS, see ssc-log-frames.sql).
      - name: '"ts"'
        type: VARSIZED
      - name: '"data"'
        type: VARSIZED

physical:
  - logical: SSC_CAM
    host: localhost:8080
    parser_config:
      type: JSON
      tuple_delimiter: "\n"
    type: MQTT
    source_config:
      server_uri: 192.168.0.10
      topic: i/cam
      flush_interval_ms: 1000
      client_id: nebulastream-factorydemo-ssc-log-frames
      qos: 0
      log_messages: true

workers:
  - host: localhost:8080
    data_address: localhost:9090
    max_operators: 10000
