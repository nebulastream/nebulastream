# Gated variant of ssc-slot-anomaly.yaml/.sql: a deterministic pan/tilt hard
# gate sits in front of BUCKET_SLOT_CNN in every one of the 9 UNION branches.
#
# Why: the slot ROIs baked into every FT_PREPROCESS_SLOT call are pixel
# boxes valid only at the exact pan/tilt the training frames were captured
# at (confirmed live: a drifted SSC pan produced high "p_absent" on every
# slot even with the HBW full, because every crop landed on background
# instead of a bucket).
#
# How: each branch's raw camera frame is windowed-joined (WINDOW TUMBLING,
# same pattern as factory-fault-demo.sql's STATION_STATE join) against that
# branch's own PTU_POS_XX reading of i/ptu/pos. MIN(...) over the window
# means ANY misaligned reading inside it fails the whole window, so only
# frames in a window where every reading matched the known training
# position (pan=0.988990783691406, tilt=-0.252666652202606, +-0.01) reach
# FT_PREPROCESS_SLOT/BUCKET_SLOT_CNN at all. This is a WHERE on the join,
# not an if/else -- NES has no branching that skips a MODEL_INFERENCE call
# outright (see factory-fault-demo.yaml's note on CASE/Conditional).
#
# No ML visibility classifier here (dropped -- the pan/tilt check alone is
# the guard; BUCKET_SLOT_CNN runs directly once a frame passes it).
#
# TODO before running:
# - The pan/tilt +-0.01 tolerance is a placeholder threshold -- tune once
#   real pan/tilt jitter at rest is known.
# - The pan/tilt join's WINDOW TUMBLING(..., SIZE 2 SEC) is copied from
#   factory-fault-demo.sql's STATION_STATE join as a starting point, not
#   measured against this feed's actual i/cam vs i/ptu/pos update rates.
#
# Sink, client_ids and output file are suffixed "-gated"/"_gated" so this
# can run alongside the ungated ssc-slot-anomaly.yaml without colliding on
# MQTT client_id (which would boot the other query's connection) or on the
# CSV sink file.
#
# i/ptu/pos is subscribed TEN separate times below: once per slot branch
# (PTU_POS_A1..PTU_POS_C3, feeding the hard gate) plus once more (PTU_POS,
# feeding the standalone alignment-print query further down in the .sql
# file) -- each with its own client_id, same reason SSC_CAM_A1..C3 need
# separate connections despite sharing one topic (see ssc-slot-anomaly.yaml
# for the full root-cause writeup: a source referenced multiple times still
# gets its own independent MQTT connection, and reusing one client_id across
# connections boots the earlier one).

sinks:
  - name: SSC_SLOT_ANOMALY_SINK
    host: localhost:8080
    schema:
      - name: '"ts"'
        type: UINT64
      - name: '"slot"'
        type: VARSIZED
      - name: '"p_absent"'
        type: FLOAT32
    type: File
    config:
      output_format: CSV
      file_path: ssc_slot_anomalies_gated.csv

  - name: PTU_ALIGNMENT_SINK
    host: localhost:8080
    schema:
      - name: '"ts"'
        type: UINT64
      - name: '"pan"'
        type: FLOAT64
      - name: '"tilt"'
        type: FLOAT64
      - name: '"alignment"'
        type: VARSIZED
    type: Print
    config:
      output_format: CSV

models:
  - name: BUCKET_SLOT_CNN
    path: /home/thanasis/Desktop/nebulastream/nes-plugins/FischerTechnik/FactoryDemo/models/bucket_slot_cnn.onnx
    input:
      - name: '"pixels"'
        type: VARSIZED
    output:
      - name: '"p_present"'
        type: FLOAT32
      - name: '"p_absent"'
        type: FLOAT32

