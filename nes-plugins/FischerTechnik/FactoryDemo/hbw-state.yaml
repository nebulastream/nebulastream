# Webapp feed for the HBW slot-state monitor (see webapp/index.html). One
# MODEL_INFERENCE call over all 9 slots per frame -- every frame reaches the
# sink whether or not any slot is empty -- publishing MQTT/JSON to a LOCAL
# broker instead of a CSV file, so a browser can subscribe to it live. This
# is a deliberately separate broker from the factory's own (192.168.0.10) --
# the query publishes to localhost:1883, and webapp/index.html subscribes to
# the same local broker over its websocket listener (localhost:9001). See
# webapp/mosquitto.conf for that broker's config and webapp/docker-compose.yml
# to run it.
#
# Unlike ssc-slot-anomaly-gated-batched.yaml/.sql, this query does NOT gate
# on PTU pan/tilt alignment: that join (camera frames vs. a PTU stream that
# only emits every ~2s) was an exact-bucket windowed equi-join, so most
# frames landed in a bucket with no matching PTU row and were silently
# dropped -- and even fixed, PTU's own ~2s cadence would still cap output
# freshness. Removed for now (see webapp latency analysis); pan/tilt gating
# will be reconsidered separately, e.g. as a lookup against last-known state
# instead of a windowed join. This file has its own client_ids (suffixed
# "-hbw-state") so it can run alongside ssc-slot-anomaly-gated-batched
# without the two stepping on each other's MQTT connections.

sinks:
  - name: HBW_STATE_SINK
    host: localhost:8080
    schema:
      - name: '"ts"'
        type: UINT64
      - name: '"p_absent_A1"'
        type: FLOAT32
      - name: '"empty_A1"'
        type: UINT64
      - name: '"p_absent_A2"'
        type: FLOAT32
      - name: '"empty_A2"'
        type: UINT64
      - name: '"p_absent_A3"'
        type: FLOAT32
      - name: '"empty_A3"'
        type: UINT64
      - name: '"p_absent_B1"'
        type: FLOAT32
      - name: '"empty_B1"'
        type: UINT64
      - name: '"p_absent_B2"'
        type: FLOAT32
      - name: '"empty_B2"'
        type: UINT64
      - name: '"p_absent_B3"'
        type: FLOAT32
      - name: '"empty_B3"'
        type: UINT64
      - name: '"p_absent_C1"'
        type: FLOAT32
      - name: '"empty_C1"'
        type: UINT64
      - name: '"p_absent_C2"'
        type: FLOAT32
      - name: '"empty_C2"'
        type: UINT64
      - name: '"p_absent_C3"'
        type: FLOAT32
      - name: '"empty_C3"'
        type: UINT64
      - name: '"num_empty"'
        type: UINT64
    type: MQTT
    config:
      output_format: JSON
      server_uri: localhost
      topic: nes/hbw/slot_state
      client_id: nebulastream-factorydemo-hbw-state-sink
      qos: 0

models:
  - name: BUCKET_SLOT_CNN_9
    path: /home/thanasis/Desktop/nebulastream/nes-plugins/FischerTechnik/FactoryDemo/models/bucket_slot_cnn_9slot.onnx
    input:
      - name: '"pixels9"'
        type: VARSIZED
    output:
      - name: '"p_absent_A1"'
        type: FLOAT32
      - name: '"p_absent_A2"'
        type: FLOAT32
      - name: '"p_absent_A3"'
        type: FLOAT32
      - name: '"p_absent_B1"'
        type: FLOAT32
      - name: '"p_absent_B2"'
        type: FLOAT32
      - name: '"p_absent_B3"'
        type: FLOAT32
      - name: '"p_absent_C1"'
        type: FLOAT32
      - name: '"p_absent_C2"'
        type: FLOAT32
      - name: '"p_absent_C3"'
        type: FLOAT32

logical:
  - name: SSC_CAM
    schema:
      - name: '"ts"'
        type: VARSIZED
      - name: '"data"'
        type: VARSIZED

physical:
  - logical: SSC_CAM
    host: localhost:8080
    parser_config:
      type: JSON
      tuple_delimiter: "\n"
    type: MQTT
    source_config:
      server_uri: 192.168.0.10
      topic: i/cam
      flush_interval_ms: 100
      client_id: nebulastream-factorydemo-hbw-state-cam
      qos: 0
      log_messages: false

workers:
  - host: localhost:8080
    data_address: localhost:9090
