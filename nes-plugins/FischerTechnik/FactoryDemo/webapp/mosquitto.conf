# Local broker for the HBW state webapp -- NOT the factory's broker
# (192.168.0.10). hbw-state.yaml's MQTT sink publishes into this one over
# plain TCP; index.html subscribes to the same messages from the browser
# over the websocket listener, since browsers can't open raw MQTT sockets.
# Anonymous access is fine here: this broker only ever runs on localhost,
# never exposed to the factory network or the internet.

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
