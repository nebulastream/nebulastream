query: |
  SELECT ts FROM GEN INTO OUT

workers:
  - host: localhost:8080

sinks:
  - name: OUT
    host: localhost:8080
    schema:
      - name: ts
        type: UINT64
        nullable: false
    type: File
    config:
      file_path: /tmp/cli_out.csv
      output_format: CSV

logical:
  - name: GEN
    schema:
      - name: ts
        type: UINT64
        nullable: false

physical:
  - logical: GEN
    host: localhost:8080
    parser_config:
      type: CSV
    type: Generator
    source_config:
      seed: 1
      max_runtime_ms: 10000000
      generator_rate_config: emit_rate 5
      generator_schema: SEQUENCE UINT64 0 10000000 1
      stop_generator_when_sequence_finishes: ALL
