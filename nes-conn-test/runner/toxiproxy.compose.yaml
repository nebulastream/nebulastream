# The fault proxy between a connector and its backend.
# The conntest CLI merges this file only for a connector that binds a scenario that needs the link.
# The runner controls it over HTTP at toxiproxy:8474 (see conntest_runner/link.py).
# The image has no shell, so there is no healthcheck; the runner polls the control API instead.
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0"]
    stop_grace_period: 0s
