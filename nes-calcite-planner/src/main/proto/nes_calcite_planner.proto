syntax = "proto3";

package nes.calcite;

option java_package = "nes.calcite.proto";
option java_multiple_files = true;

import "substrait/algebra.proto";

// The request and response of the planner (NativePlanner.plan, called through the native library): a SELECT query
// planned with Calcite down to placed physical pipelines, as a Substrait plan.

enum FieldType {
  FIELD_TYPE_UNSPECIFIED = 0;
  INT8 = 1;
  INT16 = 2;
  INT32 = 3;
  INT64 = 4;
  // Calcite and Substrait have no unsigned types: unsigned fields are widened to the next signed
  // type (UINT64 -> i64). The caller re-infers the real types from its own source schemas.
  UINT8 = 5;
  UINT16 = 6;
  UINT32 = 7;
  UINT64 = 8;
  FLOAT32 = 9;
  FLOAT64 = 10;
  BOOLEAN = 11;
  CHAR = 12;
  VARSIZED = 13;
  // Event-time field (milliseconds), appears in Substrait as precision_timestamp<3>. Fields used in DESCRIPTOR(...)
  // are treated as TIMESTAMP_MS automatically, because TUMBLE/HOP only accept timestamps.
  TIMESTAMP_MS = 14;
}

message Field {
  string name = 1;
  FieldType type = 2;
  bool nullable = 3;
}

message Source {
  string name = 1;
  repeated Field fields = 2;
  // The physical sources of this logical source.
  repeated PhysicalSource physical_sources = 3;
}

message PhysicalSource {
  uint64 id = 1;
  // The names of the fields the source emits, in the order of Source.fields, as our engine names them.
  repeated string field_names = 2;
  // The worker the source runs on. Required with PlanRequest.topology.
  string host = 3;
  // The format of its raw data (the input formatter's type, e.g. CSV), in the order of Source.fields.
  string format = 4;
}

// A worker of the topology, for placing a physical plan.
message Worker {
  string host = 1;
  // How many operators the worker can run; 0: no limit.
  uint64 max_operators = 2;
  // The workers it can send data to.
  repeated string downstream = 3;
}

message PlanRequest {
  string sql = 1;
  repeated Source sources = 2;
  // All sources are finite (e.g. test tables). Joins and aggregations without a window then get a GLOBAL window that
  // spans the whole input and fires at the end of the stream. Without it, they are rejected.
  bool finite_inputs = 3;
  // Was: physical (a logical plan without it); every plan is physical now.
  reserved 4;
  // Place the pipelines on these workers (see Placement). Without a topology, the plan is not placed and
  // runs on one worker.
  repeated Worker topology = 5;
  // The worker the sink runs on. Required with topology.
  string sink_host = 6;
  // For inspection: add a graph to each step, and the plan after each rule of the rule-based steps (PlanStep.rules).
  bool detailed_steps = 7;
  // The registered models, for MODEL_INFERENCE.
  repeated Model models = 8;
  // The registered source types, for anonymous sources in FROM (see AnonymousSource).
  repeated SourceType source_types = 9;
  // The options of all input formatters (e.g. FIELD_DELIMITER), for anonymous sources.
  repeated string format_options = 10;
  // Physical plans: every window join is a NESTED_LOOP_JOIN, also one with keys (as our optimizer's join_strategy
  // NESTED_LOOP_JOIN). Otherwise a join with at least one key is a HASH_JOIN.
  bool nested_loop_joins = 11;
  // The engine's functions that SQL (and Calcite's libraries) do not have, e.g. FROM_BASE64 and MEDIAN.
  repeated Function functions = 12;
  // Physical plans: the sink's format (the output formatter's type, e.g. CSV), or NATIVE for a sink that takes the
  // buffers as they are (e.g. Void, Checksum).
  string sink_format = 13;
  // Physical plans: how the buffers between pipelines are laid out (see Layout).
  LayoutPolicy layout_policy = 14;
}

// How the planner lays out the buffers between two pipelines (Layouts.java), where neither a source nor a sink fixes the
// layout.
enum LayoutPolicy {
  // A row per record, the fields in the order of the writing Emit.
  ROWS = 0;
  // A column per field (columnar layout).
  COLUMNS = 1;
}

// The layout of the buffers on an edge between pipelines: what the writer (an Emit, or a source) writes and every reader
// (a Scan, or the sink) reads. Fields are indexes into the edge's row (the writer's row; a reader maps them by position).
message Layout {
  // A group of fields stored together: as rows (each record's fields next to each other) or as a column per field.
  message FieldGroup {
    enum Kind {
      ROW = 0;
      COLUMN = 1;
    }
    Kind kind = 1;
    // In the order of the buffer.
    repeated uint32 fields = 2;
  }
  // Our engine's own buffers: the groups in the order of the buffer. One ROW group with all fields is the row layout, a
  // COLUMN group (or one per field) the columnar layout; the engine has no layouts with several groups of different kinds
  // yet.
  message Native {
    repeated FieldGroup groups = 1;
  }
  // The format of a source's raw data or of a sink (e.g. CSV, JSON), configured by the source's or sink's descriptor.
  message Format {
    string type = 1;
    // The order of the values in a record.
    repeated uint32 fields = 2;
  }
  oneof kind {
    Native native = 1;
    Format format = 2;
  }
}

// A function of the engine: its name in SQL, the families of its operands (Calcite's SqlTypeFamily, e.g. STRING,
// NUMERIC) and its result type (Calcite's SqlTypeName, e.g. VARBINARY, DOUBLE). The result is nullable if an operand is.
// The engine registers it under its name, as a scalar function or as an aggregation.
message Function {
  string name = 1;
  repeated string operands = 2;
  string result = 3;
  bool aggregation = 4;
}

// A source type (e.g. File, Generator) and the names of its options (e.g. FILE_PATH).
message SourceType {
  string name = 1;
  repeated string options = 2;
}

// An anonymous source in FROM (PhysicalOperator.SourceScan.anonymous), e.g.
// TABLE(FILE(schema => 'id UINT64 NOT NULL', file_path => 'data.csv', format => 'CSV')): reads a source that is not
// in the catalog. Option values are config literals: strings in single quotes, except the host and the format type.
message AnonymousSource {
  string type = 1;
  repeated Field schema = 2;
  // Source options by name (e.g. FILE_PATH, HOST).
  map<string, string> source_options = 3;
  // Input formatter options by name (e.g. TYPE, FIELD_DELIMITER).
  map<string, string> format_options = 4;
}

// A registered model (CREATE MODEL): its input and output fields, in tensor order.
message Model {
  string name = 1;
  repeated Field inputs = 2;
  repeated Field outputs = 3;
}

message PlanResponse {
  // Serialized substrait.Plan.
  bytes substrait_plan = 1;
  // Calcite's optimized plan, for debugging only.
  string explain = 2;
  // Set instead of the plan when the query is invalid or unsupported. Only the native library uses it; the service
  // fails the call instead.
  string error = 3;
  // The error is a valid query that NebulaStream cannot run (yet), rather than an invalid one.
  bool unsupported = 4;
  // The error is that the query cannot be placed on the topology (our PlacementFailure).
  bool placement_failure = 6;
  // The plan after each step of the planner, in order; for inspection only.
  repeated PlanStep steps = 5;
}

message PlanStep {
  string name = 1;
  // Calcite's plan after the step (RelOptUtil.toString).
  string plan = 2;
  // With detailed_steps: the plan as a Graphviz graph (DOT).
  string dot = 3;
  // With detailed_steps, for a step that applies rules: the plan after each rule that changed it, in order.
  repeated RuleApplication rules = 4;
  // Who does the step: Calcite, our code, or rules (Calcite's and ours) that we selected.
  string origin = 5;
}

message RuleApplication {
  string rule = 1;
  string plan = 2;
  // The changed operator is highlighted.
  string dot = 3;
  // The rule is ours (package nes.calcite), not one of Calcite's.
  bool ours = 4;
}

// The planner's description of a windowed aggregation (NesLogical.WindowAggregation), i.e. Aggregate(GROUP BY
// window_start/window_end, ...) over TUMBLE/HOP. The physical operators (Window, WindowBuild, WindowProbe) take its parts.
//
// Field indices refer to the input relation. Output columns are, in order (as Calcite's Aggregate, grouped by the keys,
// window_start and window_end):
//   group_keys..., window_start, window_end, aggregates...
// A GLOBAL window has no window_start and window_end columns. The engine's probe emits window_start, window_end,
// group_keys..., aggregates... (and a COUNT(*) if the aggregation has no aggregate); the physical plan reorders them.
message WindowAggregate {
  enum Kind {
    TUMBLING = 0;
    SLIDING = 1;
    // One window over the whole (finite) input, firing at the end of the stream; only with finite_inputs.
    // size_ms, slide_ms and the time fields are unused.
    GLOBAL = 2;
  }

  message Aggregate {
    // The aggregation's name: SUM, COUNT, MIN, MAX, AVG or one of PlanRequest.functions (e.g. MEDIAN).
    string function = 1;
    // Unset for COUNT(*).
    optional uint32 field = 2;
    // Calcite's result type (SqlTypeName, e.g. BIGINT, DOUBLE) and nullability. The result is cast to it, because our
    // aggregations type their results differently (e.g. an unsigned COUNT, a DOUBLE AVG of integers).
    string type = 3;
    bool nullable = 4;
    // The name of the result column, as Calcite names it (e.g. an alias of the query).
    string name = 5;
  }

  Kind kind = 1;
  uint32 time_field = 2;
  uint64 size_ms = 3;
  // Equal to size_ms for tumbling windows.
  uint64 slide_ms = 4;
  repeated uint32 group_keys = 5;
  repeated Aggregate aggregates = 6;
  // GLOBAL without group keys: like SQL, emit one row (counts 0, every other aggregation NULL) even if no row arrives.
  bool emit_on_empty_input = 7;
}

// The planner's description of a windowed join of two streams (NesWindowJoin), i.e. Join(TUMBLE|HOP(left),
// TUMBLE|HOP(right)) ON left.window_start = right.window_start AND ... . The physical Join operator takes its parts.
//
// Inputs: [left, right]. Output columns are, in order: window_start, window_end, left columns..., right columns...
message WindowJoin {
  enum Type {
    INNER = 0;
    LEFT = 1;
    RIGHT = 2;
    FULL = 3;
  }

  // HASH_JOIN if the join has at least one leftField = rightField key; NESTED_LOOP_JOIN otherwise.
  enum Implementation {
    HASH_JOIN = 0;
    NESTED_LOOP_JOIN = 1;
  }

  WindowAggregate.Kind kind = 1;
  uint64 size_ms = 2;
  uint64 slide_ms = 3;
  // Index into the left / right input.
  uint32 left_time_field = 4;
  uint32 right_time_field = 5;
  Type type = 6;
  Implementation implementation = 7;
  // Was: the condition and residual of the logical plan's join; the physical JoinProbe has them.
  reserved 8, 9;
}

// One physical operator of a physical plan (PlanRequest.physical), the detail of a Substrait extension relation. The
// planner decides everything, including the pipelines; the engine instantiates each operator as described. Expressions
// refer to the operator's input by position (Substrait field references); field names are the engine's physical names.
message PhysicalOperator {
  message Field {
    string name = 1;
    FieldType type = 2;
    bool nullable = 3;
  }
  // SourceScan: reads a physical source; its rows have the given origin. A pipeline of its own.
  message SourceScan {
    uint64 physical_source_id = 1;
    uint64 origin_id = 2;
    // An anonymous source in FROM (e.g. TABLE(FILE(...))), instead of a physical source of the catalog.
    AnonymousSource anonymous = 3;
  }
  // Scan: starts a pipeline. Reads the buffers of its inputs in its layout as rows of the output schema, field by field
  // in order. After a SourceScan, the layout is the source's format, which it parses. Several inputs (e.g. UNION ALL)
  // all end in an Emit of the same layout.
  message Scan {
    Layout layout = 2;
  }
  // Selection: passes the rows for which the predicate is true.
  message Selection {
    substrait.Expression predicate = 1;
  }
  // Map: computes each expression into its field, which it appends to the row. All expressions read the row as it
  // arrives, so one Map computes all values of a projection.
  message Map {
    message Assignment {
      string field = 1;
      substrait.Expression expression = 2;
    }
    reserved 1, 2;
    // Each expression reads the operator's input row; the fields are appended in this order.
    repeated Assignment assignments = 3;
  }
  // Emit: ends a pipeline. Writes the output schema's fields of the row into buffers, in its layout: before the sink,
  // the sink's format.
  message Emit {
    Layout layout = 2;
  }
  // Sink: the query's sink (the statement's INTO clause). A pipeline of its own.
  message Sink {}
  // NetworkSink: sends the buffers of its input over the channel to downstream_host. A pipeline of its own; it ends the
  // part of a placed plan that runs on one worker.
  message NetworkSink {
    string channel = 1;
    string downstream_host = 2;
    // The layout of the buffers it sends (see Layout): it sends a buffer's rows, or the whole buffer for other layouts.
    Layout layout = 3;
  }
  // NetworkSource: receives the buffers of the channel from upstream_host, in the native format. The rows keep the
  // origins, sequence numbers and watermarks they had upstream; origin_id is the first of them. A pipeline of its own.
  message NetworkSource {
    string channel = 1;
    string upstream_host = 2;
    uint64 origin_id = 3;
  }

  // WatermarkAssigner: sets the watermark of each buffer from the event time in time_field (milliseconds).
  message WatermarkAssigner {
    uint32 time_field = 1;
  }
  // One aggregation of a window: the function over the input's field (unset for COUNT(*)); its result has the type of
  // the probe's output field. include_nulls: COUNT(*) counts rows with NULL in the field.
  message WindowAggregation {
    // The aggregation's name (see WindowAggregate.Aggregate.function).
    string function = 1;
    optional uint32 field = 2;
    bool include_nulls = 3;
  }
  // The window of a WindowBuild and its WindowProbe, which share its state (the handler).
  message Window {
    // Identifies the shared state within the plan.
    uint32 handler = 1;
    WindowAggregate.Kind kind = 2;
    // GLOBAL: one window long enough to hold every row (see WindowAggregate.Kind), so its size is that window's.
    uint64 size_ms = 3;
    uint64 slide_ms = 4;
    // An aggregation without keys: the first window emits one row even without input (counts 0, everything else NULL),
    // as SQL's aggregation without GROUP BY.
    bool emit_on_empty_input = 5;
  }
  // WindowBuild: ends a pipeline. Adds each row to the state of its window: groups by key_fields, aggregates as given.
  // Fields are positions in its input; the probe's output schema names the keys and results and gives their types.
  message WindowBuild {
    Window window = 1;
    uint32 time_field = 2;
    repeated uint32 key_fields = 3;
    repeated WindowAggregation aggregations = 4;
    // The output schema of the probe, whose state this build fills.
    repeated Field probe_schema = 5;
  }
  // WindowProbe: starts a pipeline. Emits a row per window and key when the window closes: window start, window end,
  // keys, aggregation results (output_schema). Its inputs are the WindowBuilds of its window.
  message WindowProbe {
    Window window = 1;
    uint64 output_origin_id = 2;
    // The origins of the rows that the builds receive: their watermarks close the windows.
    repeated uint64 input_origin_ids = 3;
    // As in its first input (a WindowBuild), whose input gives the argument types.
    repeated WindowAggregation aggregations = 4;
  }

  // The window join of JoinBuilds and their JoinProbe, which share its state (the handler). Each side's builds store
  // the side's rows as left_schema / right_schema: the join's input columns (named as the join names them, unique
  // across both sides) and, for a hash join, key columns cast to the type both sides compare in.
  message Join {
    uint32 handler = 1;
    WindowAggregate.Kind kind = 2;
    // GLOBAL: one window long enough to hold every row (see WindowAggregate.Kind).
    uint64 size_ms = 3;
    uint64 slide_ms = 4;
    WindowJoin.Type type = 5;
    WindowJoin.Implementation implementation = 6;
    repeated Field left_schema = 7;
    repeated Field right_schema = 8;
    // Positions in the stored rows. HASH_JOIN: the keys, pairwise equal. NESTED_LOOP_JOIN: the columns the condition reads.
    repeated uint32 left_key_fields = 9;
    repeated uint32 right_key_fields = 10;
  }
  // JoinBuild: ends a pipeline. Stores each row of its side in the state of its window: input fields stored_fields
  // (positions in its input) under the names of its side's schema. time_field: the event time, a position in its input.
  message JoinBuild {
    Join join = 1;
    bool right = 2;
    uint32 time_field = 3;
    repeated uint32 stored_fields = 4;
  }
  // JoinProbe: starts a pipeline. Emits the joined rows of each closed window: window start, window end, the left
  // side's input columns, the right side's (output_schema). Its inputs are the JoinBuilds of its join. condition and
  // residual read [left stored row..., right stored row...]; HASH_JOIN: condition compares the keys.
  message JoinProbe {
    Join join = 1;
    uint64 output_origin_id = 2;
    // The origins of the rows that the builds of both sides receive: their watermarks close the windows.
    repeated uint64 input_origin_ids = 3;
    substrait.Expression condition = 4;
    repeated substrait.Expression residual = 5;
  }

  // InferModel: runs the model on each row: reads its inputs from input_fields (positions in its input, in the model's
  // input order) and appends its outputs, the last fields of the output schema.
  message InferModel {
    string model = 1;
    repeated uint32 input_fields = 2;
  }

  repeated Field output_schema = 1;
  // The pipeline the operator belongs to; a pipeline's operators form a chain from its first operator.
  uint32 pipeline = 2;
  // Placed plans: the worker that runs the operator. A placed plan has one Substrait root per worker part: the Sink, or a
  // NetworkSink.
  string host = 3;
  oneof operator {
    SourceScan source_scan = 10;
    Scan scan = 11;
    Selection selection = 12;
    Map map = 13;
    Emit emit = 14;
    Sink sink = 15;
    NetworkSink network_sink = 16;
    NetworkSource network_source = 17;
    WatermarkAssigner watermark_assigner = 18;
    WindowBuild window_build = 19;
    WindowProbe window_probe = 20;
    InferModel infer_model = 21;
    JoinBuild join_build = 22;
    JoinProbe join_probe = 23;
  }
}

// A worker's part of a placed physical plan, self-contained: the worker builds its pipelines from it alone, without the
// coordinator's catalogs. The coordinator resolves what the part reads from them.
message WorkerPart {
  // A substrait.Plan with the extensions of the whole plan and this part's relation only.
  bytes plan = 1;
  // The worker that runs the part.
  string host = 2;
  // The pipeline id of each SourceScan and NetworkSource -> its SourceDescriptor (reflected, as JSON).
  map<uint32, string> sources = 3;
  // The SinkDescriptor of the part's Sink or NetworkSink (reflected, as JSON).
  string sink = 4;
  // The model of each InferModel, by the name in the plan -> the RegisteredModel (reflected, as JSON).
  map<string, string> models = 5;
}
