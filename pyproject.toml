# The Python dependencies of the repository's tooling, in one place like the Rust workspace's dependencies in Cargo.toml.
# uv locks them into uv.lock, and the development image installs that lock into its venv (UV_PROJECT_ENVIRONMENT),
# so that tools run offline in it. After changing a dependency, run `uv lock`; the lock is part of the dependency hash.
# The repository's Python is not installed: the conn-test runner imports its code from the checkout.

[project]
name = "nebulastream"
version = "0"
requires-python = ">=3.12"
dependencies = [
    # nes-conn-test/runner
    "pytest>=8.3",
    # Connection-test loaders, nes-plugins/Sources/<Connector>/conn-test/loader.py
    "paho-mqtt>=2.1", # MQTTSource
]

[tool.uv]
package = false
