# Virtual uv workspace root for the conn-test Python, with one shared uv.lock.
# Each connector declares its loader's client libraries in its own conn-test/pyproject.toml,
# so adding a connector edits no shared file.
# All members install into one .venv.
# A connector outside nes-plugins/Sources adds its conn-test directory to the members.
#
# uv fails the whole resolve when a matched conn-test/ directory has no pyproject.toml,
# so a connector without third-party libraries still ships one with `dependencies = []`.

[project]
name = "nebulastream-conntest-workspace"
version = "0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "nes-conn-test/runner",
    "nes-plugins/Sources/*/conn-test",
]
# uv has no per-member opt-out, so a conn-test directory leaves the workspace only through this list.
exclude = []
