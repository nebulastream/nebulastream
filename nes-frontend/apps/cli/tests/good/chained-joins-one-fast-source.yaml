# Topology (star -- 9 workers):
#
#   ┌────────────────┐ ┌────────────────┐ ┌────────────────┐ ┌────────────────┐
#   │  worker-2      │ │  worker-3      │ │  worker-4      │ │  worker-5      │
#   │  S: stream     │ │  S: stream2    │ │  S: stream3    │ │  S: stream4    │
#   │  (fast 10000)  │ │                │ │                │ │                │
#   └───────┬────────┘ └───────┬────────┘ └───────┬────────┘ └───────┬────────┘
#           │                  │                  │                  │
#           └──────────┬───────┘                  │                  │
#                      └──────────────┬───────────┘                  │
#                                     └──────────────────┬───────────┘
#   ┌────────────────┐ ┌────────────────┐ ┌────────────────┐ ┌────────────────┐
#   │  worker-6      │ │  worker-7      │ │  worker-8      │ │  worker-9      │
#   │  S: stream5    │ │  S: stream6    │ │  S: stream7    │ │  S: stream8    │
#   └───────┬────────┘ └───────┬────────┘ └───────┬────────┘ └───────┬────────┘
#           │                  │                  │                  │
#           └──────────┬───────┘                  │                  │
#                      └──────────────┬───────────┘                  │
#                                     └──────────────────┬───────────┘
#                                                        │
#                                                        ▼
#                                          ┌──────────────────────────┐
#                                          │  worker-1  (cap: 10000)  │
#                                          │  K: sink (File)          │
#                                          └──────────────────────────┘
#
#   All source workers (2-9) ─► worker-1
#   8-way chained join; stream on worker-2 is fast (10000/s), rest at 10/s.

query: |
  SELECT l.window_start AS "START", l.window_end AS "END", l.id
  FROM TABLE(TUMBLE((SELECT l.window_start AS start6, l.window_end AS end6, l.start1, l.end1, l.start2, l.end2, l.start3, l.end3, l.start4, l.end4, l.start5, l.end5, l.id, l.timestamp1, l.id2, l.timestamp2, l.id3, l.timestamp3, l.id4, l.timestamp4, l.id5, l.timestamp5, l.id6, l.timestamp6, r.id7, r.timestamp7
  FROM TABLE(TUMBLE((SELECT l.window_start AS start5, l.window_end AS end5, l.start1, l.end1, l.start2, l.end2, l.start3, l.end3, l.start4, l.end4, l.id, l.timestamp1, l.id2, l.timestamp2, l.id3, l.timestamp3, l.id4, l.timestamp4, l.id5, l.timestamp5, r.id6, r.timestamp6
  FROM TABLE(TUMBLE((SELECT l.window_start AS start4, l.window_end AS end4, l.start1, l.end1, l.start2, l.end2, l.start3, l.end3, l.id, l.timestamp1, l.id2, l.timestamp2, l.id3, l.timestamp3, l.id4, l.timestamp4, r.id5, r.timestamp5
  FROM TABLE(TUMBLE((SELECT l.window_start AS start3, l.window_end AS end3, l.start1, l.end1, l.start2, l.end2, l.id, l.timestamp1, l.id2, l.timestamp2, l.id3, l.timestamp3, r.id4, r.timestamp4
  FROM TABLE(TUMBLE((SELECT l.window_start AS start2, l.window_end AS end2, l.start1, l.end1, l.id, l.timestamp1, l.id2, l.timestamp2, r.id3, r.timestamp3
  FROM TABLE(TUMBLE((SELECT l.window_start AS start1, l.window_end AS end1, l.id, l.timestamp1, r.id2, r.timestamp2
  FROM TABLE(TUMBLE(TABLE "STREAM", DESCRIPTOR(timestamp1), INTERVAL '1' SECOND)) AS l
  JOIN TABLE(TUMBLE(TABLE stream2, DESCRIPTOR(timestamp2), INTERVAL '1' SECOND)) AS r
  ON l.window_start = r.window_start AND l.id = r.id2), DESCRIPTOR(timestamp2), INTERVAL '1' SECOND)) AS l
  JOIN TABLE(TUMBLE(TABLE stream3, DESCRIPTOR(timestamp3), INTERVAL '1' SECOND)) AS r
  ON l.window_start = r.window_start AND l.id2 = r.id3), DESCRIPTOR(timestamp3), INTERVAL '1' SECOND)) AS l
  JOIN TABLE(TUMBLE(TABLE stream4, DESCRIPTOR(timestamp4), INTERVAL '1' SECOND)) AS r
  ON l.window_start = r.window_start AND l.id3 = r.id4), DESCRIPTOR(timestamp4), INTERVAL '1' SECOND)) AS l
  JOIN TABLE(TUMBLE(TABLE stream5, DESCRIPTOR(timestamp5), INTERVAL '1' SECOND)) AS r
  ON l.window_start = r.window_start AND l.id4 = r.id5), DESCRIPTOR(timestamp5), INTERVAL '1' SECOND)) AS l
  JOIN TABLE(TUMBLE(TABLE stream6, DESCRIPTOR(timestamp6), INTERVAL '1' SECOND)) AS r
  ON l.window_start = r.window_start AND l.id5 = r.id6), DESCRIPTOR(timestamp6), INTERVAL '1' SECOND)) AS l
  JOIN TABLE(TUMBLE(TABLE stream7, DESCRIPTOR(timestamp7), INTERVAL '1' SECOND)) AS r
  ON l.window_start = r.window_start AND l.id6 = r.id7), DESCRIPTOR(timestamp7), INTERVAL '1' SECOND)) AS l
  JOIN TABLE(TUMBLE(TABLE stream8, DESCRIPTOR(timestamp8), INTERVAL '1' SECOND)) AS r
  ON l.window_start = r.window_start AND l.id7 = r.id8
  INTO sink;
sinks:
  - name: sink
    host: worker-1:8080
    schema:
      - name: start
        type: UINT64
      - name: end
        type: UINT64
      - name: id
        type: UINT64
    type: File
    config:
      file_path: out.csv
      output_format: CSV

logical:
  - name: stream
    schema:
      - name: timestamp1
        type: UINT64
      - name: id
        type: UINT64
  - name: stream8
    schema:
      - name: timestamp8
        type: UINT64
      - name: id8
        type: UINT64
  - name: stream7
    schema:
      - name: timestamp7
        type: UINT64
      - name: id7
        type: UINT64
  - name: stream6
    schema:
      - name: timestamp6
        type: UINT64
      - name: id6
        type: UINT64
  - name: stream5
    schema:
      - name: timestamp5
        type: UINT64
      - name: id5
        type: UINT64
  - name: stream4
    schema:
      - name: timestamp4
        type: UINT64
      - name: id4
        type: UINT64
  - name: stream3
    schema:
      - name: timestamp3
        type: UINT64
      - name: id3
        type: UINT64
  - name: stream2
    schema:
      - name: timestamp2
        type: UINT64
      - name: id2
        type: UINT64

physical:
  - logical: stream
    host: worker-2:8080
    parser_config:
      type: CSV
      field_delimiter: ","
    type: Generator
    source_config:
      generator_rate_type: FIXED
      # This source is really fast and finishes almost immediately
      generator_rate_config: emit_rate 10000
      stop_generator_when_sequence_finishes: ONE
      seed: 1
      generator_schema: |
        SEQUENCE UINT64 0 100000 1000
        SEQUENCE UINT64 0 100 1
  - logical: stream2
    host: worker-3:8080
