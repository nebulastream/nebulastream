query: |
  SELECT
    *
  FROM
    COMPRESSED_STREAM
  INTO
    VOID_SINK
sinks:
  - name: VOID_SINK
    host: worker-1:8080
    schema:
      - name: ID
        type: UINT64
    type: Void

logical:
  - name: COMPRESSED_STREAM
    schema:
      - name: ID
        type: UINT64

decoders:
  - name: COMPRESSED
    type: ZSTD

physical:
  - logical: COMPRESSED_STREAM
    host: worker-1:8080
    type: File
    decoders:
      - COMPRESSED
    parser_config:
      type: CSV
      field_delimiter: ","
    source_config:
      file_path: data.csv.zst

workers:
  - host: worker-1:8080
    data_address: worker-1:9090
    max_operators: 10000
