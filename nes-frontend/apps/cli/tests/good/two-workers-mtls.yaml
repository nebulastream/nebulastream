# The source and sink are pinned to different worker processes.
query: SELECT * FROM GENERATOR_SOURCE INTO FILE_SINK

logical:
  - name: GENERATOR_SOURCE
    schema:
      - name: NUMBER
        type: UINT64

physical:
  - logical: GENERATOR_SOURCE
    host: worker-1:8080
    parser_config:
      type: CSV
      field_delimiter: ","
    type: Generator
    source_config:
      generator_rate_type: FIXED
      generator_rate_config: emit_rate 10000
      stop_generator_when_sequence_finishes: ALL
      generator_schema: SEQUENCE UINT64 0 10000 1

sinks:
  - name: FILE_SINK
    host: worker-2:8080
    schema:
      - name: NUMBER
        type: UINT64
    type: File
    config:
      file_path: out.csv
      output_format: CSV

workers:
  - host: worker-1:8080
    data_address: worker-1:9090
    downstream: [worker-2:8080]
    max_operators: 10000
    config:
      worker:
        total_memory_in_bytes: 16777216
        network:
          sender_io_threads: 1
          receiver_io_threads: 1
          sender_queue_size: 2
          max_pending_acks: 2
          tls:
            enabled: true
            certificate_file: /workdir/tls/worker-1.pem
            private_key_file: /workdir/tls/worker-1.key
            ca_file: /workdir/tls/ca.pem
            handshake_timeout_ms: 2000
  - host: worker-2:8080
    data_address: worker-2:9090
    max_operators: 10000
    config:
      worker:
        total_memory_in_bytes: 16777216
        network:
          sender_io_threads: 1
          receiver_io_threads: 1
          receiver_queue_size: 2
          tls:
            enabled: true
            certificate_file: /workdir/tls/worker-2.pem
            private_key_file: /workdir/tls/worker-2.key
            ca_file: /workdir/tls/ca.pem
            handshake_timeout_ms: 2000
