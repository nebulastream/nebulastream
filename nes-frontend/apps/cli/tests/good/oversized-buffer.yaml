# Topology:
#
#   ┌──────────────────────────────┐
#   │  worker-2  (cap: 10000)      │
#   │  S: GENERATOR_SOURCE         │
#   └──────────────┬───────────────┘
#                  │
#                  ▼
#   ┌──────────────────────────────┐
#   │  worker-1  (cap: 10000)      │
#   │  K: VOID_SINK                │
#   └──────────────────────────────┘
#
#   worker-2 ─► worker-1
#   The source emits a single tuple with a 9 MiB string, which exceeds the 8 MiB frame limit of the network channel.
#   No other buffer follows, so the sink can only observe the failure while stopping.

query: |
  SELECT
    *
  FROM
    GENERATOR_SOURCE
  INTO
    VOID_SINK
sinks:
  - name: void_sink
    host: worker-1:8080
    schema:
      - name: ID
        type: UINT64
      - name: TEXT
        type: VARSIZED
    type: Void

logical:
  - name: GENERATOR_SOURCE
    schema:
      - name: ID
        type: UINT64
      - name: TEXT
        type: VARSIZED

physical:
  - logical: GENERATOR_SOURCE
    host: worker-2:8080
    parser_config:
      type: CSV
      field_delimiter: ","
    type: Generator
    source_config:
      generator_rate_type: FIXED
      generator_rate_config: emit_rate 100000
      stop_generator_when_sequence_finishes: ONE
      seed: 1
      generator_schema: |
        SEQUENCE UINT64 0 1 1, RANDOMSTR 9437184 9437184

workers:
  - host: worker-1:8080
    data_address: worker-1:9090
    max_operators: 10000
  - host: worker-2:8080
    data_address: worker-2:9090
    downstream: [ worker-1:8080 ]
    max_operators: 10000
    # With the default buffer size, the string spans more raw buffers than the input formatter can track.
    config:
      worker:
        default_query_execution:
          operator_buffer_size: 1048576
