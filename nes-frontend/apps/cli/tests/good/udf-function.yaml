query: |
  SELECT plus_one(id) AS v
  FROM stream
  INTO VOID_SINK

functions:
  # Codon compiles the entrypoint module into the query pipeline on the worker, so `dump` needs neither a bridge library nor the module.
  - name: plus_one
    bridge: codon
    entrypoint: portable_udfs.add_one
    args:
      - name: x
        type: UINT64
    returns: UINT64

sinks:
  - name: VOID_SINK
    host: worker-1:8080
    schema:
      - name: v
        type: UINT64
        nullable: true
    type: Void
    config: { }
    parser_config: { }

logical:
  - name: stream
    schema:
      - name: id
        type: UINT64

physical:
  - logical: stream
    host: worker-1:8080
    parser_config:
      type: CSV
      field_delimiter: ","
    type: Generator
    source_config:
      generator_rate_type: FIXED
      generator_rate_config: emit_rate 10
      stop_generator_when_sequence_finishes: ONE
      seed: 1
      generator_schema: |
        SEQUENCE UINT64 0 1 1

workers:
  - host: worker-1:8080
    data_address: worker-1:9090
    max_operators: 10000
