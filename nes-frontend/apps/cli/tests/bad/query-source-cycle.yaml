# A has a query source that reads B, and B has a query source that reads A: a cycle.

query: |
  SELECT * FROM A INTO VOID_SINK

sinks:
  - name: VOID_SINK
    host: worker-1:8080
    schema:
      - name: X
        type: UINT64
    type: Void

logical:
  - name: A
    schema:
      - name: X
        type: UINT64
  - name: B
    schema:
      - name: X
        type: UINT64

physical:
  - query: SELECT X FROM B INTO A
  - query: SELECT X FROM A INTO B

workers:
  - host: worker-1:8080
    data_address: worker-1:9090
    max_operators: 10000
