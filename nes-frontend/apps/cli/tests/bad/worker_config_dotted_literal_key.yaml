# Regression topology: a literal dotted worker config key. A flatten path that synthesizes
# dot-separated keys cannot distinguish a literal key like "worker.network.receiver_queue_size"
# from the nested form {worker: {network: {receiver_queue_size: ...}}} and silently merges them.
# The worker 'config:' subtree is applied verbatim as a YAML node, so the literal dotted key is
# treated as its own (unrecognized) key and rejected -- no silent collision.

query: |
  SELECT
    *
  FROM
    GENERATOR_SOURCE
  INTO
    VOID_SINK
sinks:
  - name: VOID_SINK
    host: worker-1:8080
    schema:
      - name: DOUBLE
        type: FLOAT64
    type: Void

logical:
  - name: GENERATOR_SOURCE
    schema:
      - name: DOUBLE
        type: FLOAT64

physical:
  - logical: GENERATOR_SOURCE
    host: worker-1:8080
    parser_config:
      type: CSV
      field_delimiter: ","
    type: Generator
    source_config:
      generator_rate_type: FIXED
      generator_rate_config: emit_rate 10
      stop_generator_when_sequence_finishes: NONE
      seed: 1
      generator_schema: |
        NORMAL_DISTRIBUTION FLOAT64 0 1

workers:
  - host: worker-1:8080
    data_address: worker-1:9090
    max_operators: 10000
    config:
      worker.network.receiver_queue_size: 2
