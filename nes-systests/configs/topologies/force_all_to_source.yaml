
workers:
  - host: "sink-node:8080"
    data_address: "sink-node:9090"
    max_operators: 1
    config:
      worker:
        query_engine:
          number_of_worker_threads: 4


  - host: "source-node:8080"
    data_address: "source-node:9090"
    max_operators: 100
    downstream:
      - "sink-node:8080"
    config:
      worker:
        query_engine:
          number_of_worker_threads: 12

allow_source_placement:
  - "source-node:8080"

allow_sink_placement:
  - "sink-node:8080"