# Topology:
#
#   ┌──────────────────────────┐     ┌──────────────────────────┐     ┌──────────────────────────┐
#   │ source-node:8080 (S)     │────►│ sink-node-1:8080 (K)     │────►│ sink-node-2:8080 (K)     │
#   │ capacity: 100            │     │ capacity: 10000          │     │ capacity: 10000          │
#   └──────────────────────────┘     └──────────────────────────┘     └──────────────────────────┘
#
# The three nodes of three-node.yaml in a line rather than a fork. Sinks may go on the two downstream nodes only,
# so a query writing into two sinks forks its plan on the source node while the path to the far sink runs through
# the node holding the near one: a Y-shaped plan laid over a linear topology.
workers:
  - host: "sink-node-2:8080"
    data_address: "sink-node-2:9090"
    max_operators: 10000
    config:
      worker:
        default_query_execution:
          execution_mode: INTERPRETER

  - host: "sink-node-1:8080"
    data_address: "sink-node-1:9090"
    max_operators: 10000
    downstream:
      - "sink-node-2:8080"
    config:
      worker:
        default_query_execution:
          execution_mode: INTERPRETER

  - host: "source-node:8080"
    data_address: "source-node:9090"
    max_operators: 100
    downstream:
      - "sink-node-1:8080"
    config:
      worker:
        default_query_execution:
          execution_mode: INTERPRETER

allow_source_placement:
  - "source-node:8080"

allow_sink_placement:
  - "sink-node-1:8080"
  - "sink-node-2:8080"
