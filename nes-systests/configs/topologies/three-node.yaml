# Topology:
#
#   ┌──────────────────────────┐     ┌──────────────────────────┐
#   │ source-node:8080 (S)     │────►│ sink-node-1:8080 (K)     │
#   │ capacity: 100            │──┐  │ capacity: 10000          │
#   └──────────────────────────┘  │  └──────────────────────────┘
#                                 │  ┌──────────────────────────┐
#                                 └─►│ sink-node-2:8080 (K)     │
#                                    │ capacity: 10000          │
#                                    └──────────────────────────┘
#
# Sinks may go on the two sink nodes only, so a query writing into two sinks always puts them on different
# workers, both across the node boundary from the sub-plan they share. The two-node topologies cannot express
# that: their sink node is the only one downstream of the source, so a second sink either joins it there or
# stays on the source node.
workers:
  - host: "sink-node-1:8080"
    data_address: "sink-node-1:9090"
    max_operators: 10000
    config:
      worker:
        default_query_execution:
          execution_mode: INTERPRETER

  - host: "sink-node-2:8080"
    data_address: "sink-node-2:9090"
    max_operators: 10000
    config:
      worker:
        default_query_execution:
          execution_mode: INTERPRETER

  - host: "source-node:8080"
    data_address: "source-node:9090"
    max_operators: 100
    downstream:
      - "sink-node-1:8080"
      - "sink-node-2:8080"
    config:
      worker:
        default_query_execution:
          execution_mode: INTERPRETER

allow_source_placement:
  - "source-node:8080"

allow_sink_placement:
  - "sink-node-1:8080"
  - "sink-node-2:8080"
