# Permanent exclusions for systest startup.
# Examples:
# disabled_test_files:
#   - <relative/path/to/test>.test
# exclude_groups:
#   - <group name>
#
# - large scale tests are always skipped below
exclude_groups:
  - large
# - AlignEagerLE's result depends on cross-source arrival order (driving tuples that arrive
#   before any searched-side state are dropped by design), so it fails nondeterministically
disabled_test_files:
  - operator/align/AlignEagerLE.test
