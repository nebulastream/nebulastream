    host: localhost:8080
    type: Pipe
    parser_config:
      type: NATIVE
    source_config:
      pipe_name: rgb_with_faces_pipe
  - logical: video
    host: localhost:8080
    type: Video
    parser_config:
      type: NATIVE
    source_config:
      SOURCE_SELECTOR: 2
  - logical: rgb_video_pipe
    host: localhost:8080
    type: Pipe
    parser_config:
      type: NATIVE
    source_config:
      pipe_name: rgb_video_frames
  - logical: audio_pipe
    host: localhost:8080
    type: Pipe
    parser_config:
      type: NATIVE
    source_config:
      pipe_name: audio_pipe
  - logical: audio_window_pipe
    host: localhost:8080
    type: Pipe
    parser_config:
      type: NATIVE
    source_config:
      pipe_name: audio_window_pipe
  - logical: audio_label_detection_pipe
    host: localhost:8080
    type: Pipe
    parser_config:
      type: NATIVE
    source_config:
      pipe_name: audio_label_detection_pipe
  - logical: kws_labels
    host: localhost:8080
    type: File
    parser_config:
      type: CSV
      field_delimiter: ","
    source_config:
      file_path: /home/ls/dima/nebulastream/demo/mqtt-frame-viewer/kws_labels.csv
  - logical: thermal_video_pipe
    host: localhost:8080
    type: Pipe
    parser_config:
      type: NATIVE
    source_config:
      pipe_name: thermal_video_frames
  - logical: video_pipe
    host: localhost:8080
    type: Pipe
    parser_config:
      type: NATIVE
    source_config:
      pipe_name: video_frames
  - logical: microphone
    host: localhost:8080
    type: Audio
    parser_config:
      type: NATIVE
    source_config:
      SAMPLE_RATE: 16000
  - logical: smaps_rollup
    host: localhost:8080
    type: Process
    parser_config:
      type: JSON
    source_config:
      command: >-
        awk 'BEGIN{printf "{"} /^[A-Za-z_][A-Za-z0-9_]*:/ {k=$1; sub(/:$/,"",k);
        normalized=""; for(i=1;i<=length(k);i++){c=substr(k,i,1);
        if(i>1 && c~/[A-Z]/ && substr(k,i-1,1)~/[a-z]/) normalized=normalized "_";
        normalized=normalized c} printf "%s\"%s_KB\":%s",(n++?",":""),toupper(normalized),$2}
        END{print "}"}'
        "/proc/$pid/smaps_rollup"
      refresh_interval_ms: 1000
      flush_interval_ms: 100

workers:
  - host: localhost:8080
    data_address: localhost:9090
